<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
    <title>Kalkulator: Napredni Bruto in Neto</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
            margin: 0;
            /* Ukine dvojni dotik za povecavo (podvojen dotik gumba je s tem takojsen).
               Scipanje z dvema prstoma OSTANE - potrebuje ga korak 11. */
            touch-action: manipulation;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        h2 {
            font-size: 1.2em;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        /* ---------- Harmonika sklopa (31. 7. 2026) ----------
           Naslov tabele je gumb, ki skrije ali pokaze cel sklop.
           Puscica stoji ob DESNEM robu, enako kot pri stolpcih - tako so vse
           puscice na strani v isti navpicnici. Tudi v zaprtem traku.
           Zaprt trak: ime levo, skupni znesek desno, puscica skrajno desno.

           Sidro za puscico je NASLOV, ne bela kartica. Namenoma: .container
           na telefonu nosi prilepljen Povzetek in vanj ne posegamo. */
        h2.sklop-naslov {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 44px;      /* zanesljiv dotik s prstom, enako kot .col-header */
            padding-right: 24px;   /* prostor za puscico */
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Kljukica je NARISANA, ne zapisana z znakom: kvadratek z dvema robovoma,
           zavrten za 45 stopinj. Znak bi risala pisava, mi pa je ne nadzorujemo -
           ⌃ in ⌄ na iPhonu nista prisla iz iste pisave in sta bila razlicno velika
           (Borut, 4. 8. 2026). Ista past kot pri kosu za smeti, ki je zato narisan.

           Velikost je v DELEZU pisave naslova, ne v pikah: 1.15em od 1.2em naslova
           je 22 px, kolikor je merila prejsnja kljukica. Ko se pisava spremeni
           (koraka 10 in 11), se kljukica spremeni z njo.
           Barvo pobere iz besedila (currentColor), zato pravila za barve sklopov
           delujejo naprej brez sprememb.
           45deg = kljukica navzdol, -135deg = navzgor. */
        h2.sklop-naslov::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            font-size: 1.15em;
            width: 0.4em;
            height: 0.4em;
            box-sizing: border-box;
            border-right: 0.1em solid currentColor;
            border-bottom: 0.1em solid currentColor;
            transform: translateY(-50%) rotate(-135deg);
            color: #868e96;
        }
        .container.zaprt > h2.sklop-naslov::after {
            transform: translateY(-50%) rotate(45deg);
        }

        /* Ime se pri ozkem zaslonu obreze, da znesek in puscica ostaneta na mestu */
        .sklop-ime {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Znesek je viden SAMO v zaprtem traku; odprt sklop ga kaze v Povzetku.
           Ni prepisan - je tretje mesto istega izpisa (razred tot-total-N). */
        .sklop-znesek {
            display: none;
            font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            text-align: right;
        }
        .container.zaprt .sklop-znesek { display: block; }
        .sklop-znesek::after { content: ' €'; }
        /* Ce rezultat ni izracunljiv, showTotal izpise "???" - takrat evra ni */
        .sklop-znesek.result-na::after { content: ''; }
        .sklop-znesek.result-na { color: #b91c1c; }

        /* Zaprt sklop: vidi se samo trak */
        .container.zaprt > .calc-grid { display: none; }
        .container.zaprt > h2.sklop-naslov { margin-bottom: 0; }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);   /* Povzetek je enako sirok kot ostali stolpci */
            gap: 15px;
            align-items: start;
        }

        .col {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;   /* brez tega bi dolga vrstica raztegnila mrežo čez okvir */
            position: relative;   /* sidro za puščico harmonike */
        }

        /* Naslov stolpca je gumb, ki odpira in zapira harmoniko.
           Velikost 16 px in višina 44 px sta zahtevi za zanesljiv dotik s prstom. */
        .col-header {
            font-weight: 600;
            font-size: 16px;
            /* Visina vrstice mora biti ista v odprtem in zaprtem stanju. Zaprt trak
               na telefonu ima 1.4 (da se strehica nad C in S ne odreze, ker je
               besedilo tam obrezano), odprt pa je imel privzeto ~1.2. Crke stojijo
               na sredini vrstice, zato jih je visja vrstica potisnila ~1,5 px nizje
               in naslov je ob odpiranju skocil. Na Macu tega pravila ni, zato je
               bilo tam ze prej v redu (Borut, 4. 8. 2026). */
            line-height: 1.4;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            margin-bottom: 5px;
            border-bottom: 1px solid #ccc;   /* enako kot obroba vnosnih polj; danes nevidno, prekrije ga 2px barvna crta */
            /* Zrak nad naslovom in pod njim je ENAK (Borutova izbira B, 5. 8. 2026):
               nad besedilom je rob stolpca (15 px) + 4 px zamika, pod njim natanko
               toliko. Merjeno na napravi je bilo prej 20 nad in 17 pod.
               Najmanjse visine ni vec - visino da podloga, ker sicer njen ostanek
               tiho pade pod besedilo in razmerje podre. Povrsina za dotik je s tem
               45 px na Macu in 40 px na telefonu, torej vec kot prej. */
            padding-top: 4px;      /* enak zamik kot v zaprtem traku */
            padding-bottom: 19px;
            padding-right: 24px;   /* prostor za puščico */
            display: flex;
            /* Naslov stoji na VRHU svojega prostora, ne na sredini. Prej je bil
               sredinjen v 44 px in je ob odpiranju stolpca poskocil navzdol -
               v zaprtem traku je namrec pri vrhu. Visina 44 px ostane zaradi
               zanesljivega dotika s prstom; spremeni se le lega besedila. */
            align-items: flex-start;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .col-header:active { color: #212529; }

        /* Puščica stoji ob desnem robu STOLPCA, ne ob naslovu, zato je pri
           zaprtem traku vedno skrajno desno - za zneskom. */
        /* Narisana kljukica, enako kot pri naslovu sklopa. Velikost je delez
           pisave naslova: 1.375em od 16 px je 22 px.
           Stoji 11 px od roba - pas, ki ga zaseda, je enak kot pri prejsnjem
           trikotniku in zneski v zlozenem traku se ne premaknejo.
           Sidro je STOLPEC, ne naslov, zato je v zlozenem traku skrajno desno,
           za zneskom. Zato je sredina naslova povedana s stevilko: 15 px zgornjega
           roba stolpca + 4 px zamika naslova + polovica vrstice. Ker naslov odslej
           stoji na istem mestu v obeh stanjih, velja ista stevilka za odprt in
           zaprt stolpec - zaprti spremeni samo smer. */
        .col-header::after {
            content: '';
            position: absolute;
            right: 11px;
            top: 28px;
            font-size: 1.375em;
            width: 0.4em;
            height: 0.4em;
            box-sizing: border-box;
            border-right: 0.1em solid currentColor;
            border-bottom: 0.1em solid currentColor;
            transform: translateY(-50%) rotate(-135deg);
            color: #868e96;
        }
        /* Zaprt stolpec spremeni samo smer, ne velikosti in ne lege. */
        .col.zaprt > .col-header::after {
            transform: translateY(-50%) rotate(45deg);
        }

        /* Zaprt stolpec: naslov levo, njegov skupni znesek desno, puščica skrajno desno.
           Znesek ni prepisan drugam - viden je isti element, ki ga izračun že polni. */
        .col.zaprt {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            padding-right: 34px;
        }
        .col.zaprt > * { display: none; }
        .col.zaprt > .col-header,
        .col.zaprt > .summary-block { display: flex; }
        .col.zaprt > .col-header {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
            padding-bottom: 0;
            padding-right: 0;
            border-bottom: none;
        }
        .col.zaprt > .summary-block {
            flex-shrink: 0;
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }
        .col.zaprt .sum-label,
        .col.zaprt .share-line { display: none; }

        label {
            font-size: 0.85em;
            color: #555;
            margin-bottom: -5px;
            display: block;
        }

        /* ---------- Stolpec 4: napis in polje v isti vrstici (31. 7. 2026) ----------
           Prvi stolpec mreze je max-content, zato sirino napisov doloci najdaljsi
           med njimi SAM - v kodi ni izmisljene stevilke. Ce se besedila kdaj
           spremenijo, se poravnava prilagodi brez posega v CSS.
           minmax(0, 1fr) na drugem stolpcu poskrbi, da se pri ozkem oknu skrci
           POLJE, napis pa ostane cel in nic ne uide cez rob kartice.
           Ovoj mora ostati NEPOSREDEN otrok .col, sicer ga harmonika
           (.col.zaprt > * { display: none }) ob zaprtju ne skrije. */
        .pot-polja {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            align-items: center;
            gap: 12px 8px;   /* 12 px med vrsticami (enako kot .col), 8 px med napisom in poljem */
        }
        .pot-polja label {
            text-align: left;
            margin-bottom: 0;   /* -5px je stiskal napis k polju SPODAJ; v vrstici je odvec */
        }

        input[type="text"], input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;   /* pod 16 px iPhone ob dotiku polja približa stran */
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }

        /* ---------- Drsniki pri davkih ----------
           Neaktivna proga je bila prebleda. Ko pa progi prevzamemo videz,
           Safari PRENEHA sam risati zapolnjeni del in zamenjave zanj v CSS ni.
           Zato je proga preliv, mejo med zapolnjenim in praznim delom (--del)
           pa nastavi koda ob vsakem premiku (glej osveziProgo).
           Siva: #d3d3d3 (privzeta v brskalniku), potemnjena za 8 % -> #c2c2c2.
           Pot do te vrednosti: 30 % in 15 % sta bila pretemna, preizkuseno
           na napravi 29. 7. 2026. */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            margin-top: 5px;
            height: 20px;          /* prostor za ročico; brez tega bi se polje sesedlo */
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right,
                        #3498db 0 var(--del, 0%),
                        #c2c2c2 var(--del, 0%) 100%);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #ccc;   /* enako debela kot obroba vnosnih polj */
            margin-top: -6px;         /* (4 - 16) / 2: ročica na sredini proge */
        }
        /* Firefox zapolnjeni del riše sam, zato tam preliva ne potrebujemo */
        input[type="range"]::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: #c2c2c2;
        }
        input[type="range"]::-moz-range-progress {
            height: 4px;
            border-radius: 2px;
            background: #3498db;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #ccc;
        }

        /* Številska polja poravnamo desno */
        .num-field { text-align: right; }

        /* Urejene vrstice za stroške / davke */
        .cost-row {
            display: flex;
            gap: 5px;
        }
        .cost-row .name-field {
            flex: 2;
            min-width: 0;
        }
        .cost-row .num-field {
            flex: 1;
            min-width: 0;
            padding-right: 8px; /* Zamik številke od roba */
        }

        /* Vrstice so se dotikale: gumb "-" zgornje vrstice je stal tik nad gumbom
           spodnje. Med vrsticami so zato 4 px.
           Velja samo za Honorarje in Stroske - v Davkih je med vrsticami ze drsnik.
           Pri eni sami vrstici se ne sprozi: nima predhodnice. */
        .vrstice .cost-row + .cost-row { margin-top: 4px; }

        /* 1g: gumb "+" ni vec v vrstici, ampak stoji sam pod njimi. Desno, v isti
           navpicnici kot gumbi "-" nad njim - zato flex-end in nic zamika desno.
           Nad njim je 10 px: isti razmik kot prej nad zadnjo vrstico, da se rdec "-"
           in zelen "+" ne dotikata. Velja v vseh treh stolpcih z vrsticami, tudi v
           Davkih, da gumb povsod stoji enako dalec od vsebine.
           Prazen stolpec razmika ne potrebuje: gumb je takrat edini otrok. */
        .add-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .add-row:first-child { margin-top: 0; }

        /* Gumb je enako visok kot vnosno polje ob njem: visine ne dolocamo, ampak
           jo prevzame od vrstice (align-self: stretch). Stalnih 35 px je pomenilo,
           da se je ob veliki pisavi polje raztegnilo, gumb pa ne - spodnja robova
           se nista vec ujemala. Spodnja meja ostane 35 px, da gumb nikoli ni manjsi
           od dosedanjega. */
        .btn-action {
            width: 32px;
            align-self: stretch;
            min-height: 35px;
            border: none;
            border-radius: 4px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-add { background-color: #2ecc71; }
        .btn-remove { background-color: #e74c3c; }
        /* Temnejsa barva velja samo tam, kjer miska res obstaja. Na telefonu je
           stanje "miska je nad gumbom" obviselo na zadnjem pritisnjenem gumbu,
           dokler se nisi dotaknil drugam (Borut, 5. 8. 2026). Kratek blisk ob
           dotiku ni nas - rise ga telefon sam in ostane. */
        @media (hover: hover) {
            .btn-add:hover { background-color: #27ae60; }
            .btn-remove:hover { background-color: #c0392b; }
        }

        /* touch-action se NE podeduje: pravilo na body samo po sebi dvojnega dotika
           ne ukine. Zato ga dobi vsak element posebej. Drsniki ostanejo pri 'auto',
           da se vlecenje rocice ne spremeni. */
        body * { touch-action: manipulation; }
        input[type="range"] { touch-action: auto; }

        /* Gumba stolpca (ponastavi / razveljavi) stojita LEVO, v svojem bloku.
           Z napisom in zneski na desni nimata zveze: leva stran je nizja od desne
           (35+35 proti ~103 px), zato se ob pojavu razveljavitve ne premakne nic. */
        /* Gumba sta IZVEN toka: sedita v praznem prostoru levo od zneskov.
           Ce bi stala v vrsti, bi zneskom vzela 40 px sirine in najdaljsa
           vrstica ("Od 649,96 €") se ne bi vec poravnala z zneskom nad njo.
           Visine ne odmerjata: zneski so visoki ~103 px, gumba 74. */
        .summary-block { position: relative; }
        .sb-gumbi {
            position: absolute;
            left: 0;
            top: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* V zlozenem traku gumbov ni: en dotik traku stolpec odpre in bi hkrati brisal. */
        .col.zaprt .sb-gumbi { display: none; }

        .btn-stolpec {
            width: 32px;
            height: 35px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        /* Barva obrobe prvega stolpca: vidna na obeh podlagah, ostane v druzini sklopa. */
        .btn-ponastavi { background-color: #dfc08a; }
        .row-second .btn-ponastavi { background-color: #9ccec4; }
        /* Gumba za cel del (neobdavcen / obdavcen) stojita pod stolpcem 4, v isti
           navpicnici kot kos tega stolpca. Mesto v mrezi je stalno: odpiranje in
           zapiranje stolpcev spremeni njihovo visino, ne sirine. Zamik 15 px je
           notranji rob stolpca - natanko toliko je od roba oddaljen kos v njem.
           Stolpec 4 (potni stroski) stoji na cetrtem mestu v OBEH vrstah: v
           obdavcenem delu mesto stolpca Davki drzi prazno polje .col-empty. */
        .del-gumbi {
            grid-column: 4;
            display: flex;
            gap: 4px;
            padding-left: 15px;
        }

        /* Po ponastavitvi je kos pasiven: sicer bi drug dotik prepisal pomnik
           s ze ponastavljenim stanjem in razveljavitev ne bi vrnila nicesar.
           Siva je ista kot pri crtah. */
        .btn-ponastavi.pasiven { background-color: #ccc; cursor: default; }
        .btn-razveljavi {
            background-color: #f39c12;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }

        /* Kos za smeti je narisan iz dveh pravokotnikov, ne iz slicice (emoji):
           slicico Apple vedno izrise barvno in je na obarvanem gumbu ni mogoce pobeliti. */
        .kos { position: relative; display: block; width: 14px; height: 18px; }
        .kos-pokrov {
            position: absolute; top: 3px; left: 0;
            width: 14px; height: 2px;
            background: #fff; border-radius: 1px;
        }
        .kos-pokrov::after {
            content: '';
            position: absolute; top: -3px; left: 4px;
            width: 6px; height: 2px;
            background: #fff; border-radius: 1px;
        }
        .kos-telo {
            position: absolute; top: 7px; left: 2px;
            width: 10px; height: 11px;
            background: #fff; border-radius: 0 0 2px 2px;
        }

        /* Pripravljeno polje: prvi dotik ga obarva, prva tipka povozi vso vsebino.
           Pravega oznacevanja namenoma ne uporabljamo - iPhone ob njem prikaze
           svoj oblacek "Kopiraj / Prilepi", ki pokrije vrstico nad poljem. */
        input.pripravljeno { background-color: #fff6cc; }

        /* Poravnava zneskov na dnu stolpcev.
           Pisava z enako širokimi znaki + desna poravnava poskrbita, da so pike nad
           pikami, decimalke nad decimalkami in znaka € / % v istem stolpcu.
           Vsi zneski se izpisujejo na 2 decimalki, zato se vrstice ujamejo same. */
        .mini-result,
        .share-line,
        .result-value {
            font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
        }

        /* Velikosti pisave so v pikslih in nad 16 px: brskalniki z vklopljeno
           nastavitvijo "najmanjša velikost pisave" (Safari) manjše vrednosti
           samodejno povečajo na ~16 px, zato bi bile med seboj videti enake. */

        /* Napis stoji nad številkami, tako kot v polju s končnimi zneski */
        .sum-label {
            font-size: 16px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: right;
            margin-bottom: 3px;
            white-space: nowrap;   /* napis vedno v eni vrstici */
        }

        /* Blok povzetka na dnu stolpca: napis + seštevek + delež + osnova */
        .summary-block {
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid #ccc;   /* enako kot obroba vnosnih polj */
        }
        .mini-result {
            font-size: 21px;
            color: #666;
            font-weight: bold;
        }
        .share-line {
            font-size: 21px;
            color: #666;
            font-weight: bold;
            margin-top: 3px;
        }

        /* Stolpec brez okvirja (nosilec polja z zneski) */
        .col-plain {
            padding: 0;
            background: none;
            border: none;
            min-width: 0;
        }
        /* Prazno mesto v 2. vrstici, kjer v 1. vrstici stoji stolpec Davki */
        .col-empty {
            background: none;
            border: none;
            padding: 0;
        }
        /* Druga vrstica stolpcev */
        .row-second {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #ccc;   /* enako kot obroba vnosnih polj */
        }

        /* ---------- Barve sklopov ----------
           Sklop je ena .calc-grid. Zgornji je NEOBDAVCEN (davek se sele odsteje,
           topla barva), spodnji OBDAVCEN (davek je ze placan, hladna barva).
           Barva povezuje stolpce v sklop, zato jo dobijo vsi razen Povzetka
           (.col-plain), ki ima svojo vijolicno in ostane najmocnejsi na strani.

           Prvi stolpec sklopa je osnova - izhodisce izracuna in na telefonu
           edini privzeto odprt. Poudarjen je z ISTIM odtenkom, le mocnejsim:
           druga barva bi ga iz sklopa izlocila, namesto da ga v njem poudari.
           Ujema se s prvim otrokom mreze, ker osnova v HTML vedno stoji prva. */

        /* --- neobdavcen sklop: topla --- */
        .calc-grid:not(.row-second) .col:not(.col-plain) {
            background: #fffbf2;
            border-color: #f0e0c8;
        }
        .calc-grid:not(.row-second) .col:not(.col-plain) > .col-header,
        .calc-grid:not(.row-second) .col:not(.col-plain) > .col-header::after {
            color: #a35d09;
        }
        /* Polna crta pod naslovom dobi vsak stolpec sklopa; zaprt trak je brez nje. */
        .calc-grid:not(.row-second) .col:not(.col-plain):not(.zaprt) > .col-header {
            border-bottom: 2px solid #a35d09;
        }
        .calc-grid:not(.row-second) .col:first-child {
            background: #fdefd8;
            border-color: #dfc08a;
        }
        .calc-grid:not(.row-second) .col:first-child > .col-header {
            color: #8a4d05;
        }

        /* --- obdavcen sklop: hladna --- */
        .row-second .col:not(.col-plain) {
            background: #f2fbf9;
            border-color: #cbe8e2;
        }
        .row-second .col:not(.col-plain) > .col-header,
        .row-second .col:not(.col-plain) > .col-header::after {
            color: #0d6b60;
        }
        .row-second .col:not(.col-plain):not(.zaprt) > .col-header {
            border-bottom: 2px solid #0d6b60;
        }
        .row-second .col:first-child {
            background: #ddf1ec;
            border-color: #9ccec4;
        }
        .row-second .col:first-child > .col-header {
            color: #0a5850;
        }

        .result-box {
            text-align: right;
            background: #eef2ff;
            padding: 16px 10px;
            border-radius: 8px;
            border: 2px solid #c7d2fe;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }
        .result-caption {
            color: #4f46e5;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            /* ista moc kot crte pod naslovi stolpcev: 2px v barvi svojega sklopa */
            border-bottom: 2px solid #4f46e5;
        }
        /* Vsaka vrstica Povzetka ima isto razdelitev, zato se stevilke same
           poravnajo druga pod drugo - tudi vrstica s sestevkom. */
        .result-item,
        .result-caption {
            display: grid;
            grid-template-columns: 22px 1fr 1fr;
            gap: 8px;
            align-items: baseline;
        }
        .result-item { margin-bottom: 10px; }
        .result-item:last-child { margin-bottom: 0; }

        /* Ikone stojijo zunaj prostora za stevilke, skrajno levo */
        .ikona {
            font-size: 16px;
            font-weight: 700;
            color: #4f46e5;
            text-align: center;
            line-height: 1;
        }
        .ikona-neobdavcen { text-decoration: line-through; }

        /* Leva polovica: vnesena osnova, brez znaka za evro */
        .result-osnova {
            font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
            font-size: 21px;
            font-weight: bold;
            color: #4f46e5;
        }
        .result-sum .result-osnova { font-size: 24px; }

        /* Naslova stojita nad svojimi stevilkami, torej poravnana desno kot one.
           Znak za evro stoji enkrat, v koloni ikon. */
        .cap-levo, .cap-desno { text-align: right; }
        .cap-evro {
            text-align: center;
            font-weight: 700;
        }
        .result-value {
            font-size: 21px;
            font-weight: bold;
            color: #4f46e5;   /* enaka barva kot napisi in levi zneski */
        }
        .result-sum {
            margin-top: 12px;
            padding-top: 10px;
            /* za polovico sibkeje od zgornje crte: enaka barva, polovicna debelina */
            border-top: 1px solid #4f46e5;
        }
        .result-sum .result-value { font-size: 24px; }   /* vrstica seštevka ostane večja, a gre skozi širino */
        .result-value.result-na {
            font-size: 16px;
            color: #b91c1c;
        }

        @media (max-width: 900px) {
            .calc-grid { grid-template-columns: 1fr; }

            /* Vec prostora za napise: stanjsamo vse tri plasti robov.
               Ne do nicle - bela kartica s senco bi sicer "visela" na robu zaslona. */
            body { padding: 6px; }
            .container { padding: 10px; border-radius: 8px; }
            .col { padding: 10px 12px; }
            .col-plain { padding: 0; }   /* sicer bi bil Povzetek za 24 px ozji od ostalih */

            /* Na telefonu je mreza en sam stolpec - cetrtega mesta ni. Zamik je
               manjsi, ker ima stolpec na telefonu ozji notranji rob (12 px). */
            .del-gumbi { grid-column: 1; padding-left: 12px; }

            /* Naslov harmonike in znesek eden POD drugim, ne eden ob drugem.
               Tako si ne delita sirine in se ne moreta prekrivati. */
            .col.zaprt {
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
                padding-right: 26px;   /* prostor za puscico */
            }
            .col.zaprt > .col-header {
                flex: none;
                min-height: 0;
                padding-top: 4px;
            }
            /* Naslov ostane v ENI vrstici; ce je predolg, se obrez'e s tremi pikicami. */
            .col.zaprt > .col-header > * { min-width: 0; }
            .col.zaprt > .summary-block {
                display: block;   /* prek osnovnega flex pravila, da poravnava sploh ucinkuje */
                align-self: stretch;
                text-align: right;
            }
            .col.zaprt .mini-result { text-align: right; }

            /* Polje s končnimi zneski skoči na vrh in ostane prilepljeno,
               da so zneski med vnašanjem ves čas pred očmi. */
            .calc-grid > .col-plain {
                order: -1;
                position: sticky;
                top: 0;
                z-index: 20;
            }

            /* ---------- Samomerljiva visina Povzetka (7. 8. 2026) ----------
               Kadar brskalnik SAM pripelje vnosno polje na zaslon (npr. po
               zaprtju tipkovnice), naj zgoraj pusti toliko prostora, kot je
               visok prilepljen Povzetek, plus 8 px zraka.

               Visina se MERI, ne vpisuje - aplikacija gre v trgovini in naprav
               ne poznamo. Meri jo meriPovzetek() na koncu skripta.

               Pravilo stoji na DRSNEM PROSTORU STRANI (scroll-padding-top na
               html). V koraku 1d je isto stalo na vnosnem polju
               (scroll-margin-top) in ga je Safari prezrl. Druga lastnost,
               druga pot skozi brskalnik.

               Zakaj znotraj tega bloka: na Macu Povzetek NI prilepljen, je peti
               stolpec, visok kot cela vrstica - rezerviral bi pol zaslona. Ko
               bo korak 11 Mac preklopil na telefonsko postavitev, se pravilo
               vklopi samo od sebe, ker je vezano na isti pogoj.

               192 + 8 = 200: ce merjenje ne stece (star brskalnik brez
               ResizeObserver), ostane natanko dosedanje vedenje.

               POZOR: to ni straza, ki bi prostor drzala prazen. Izvede se SAMO
               takrat, kadar brskalnik kaj premika. Ce je polje ze vidno - tudi
               ce lezi pod Povzetkom - se ne zgodi nic. Deluje po ovinku.
               Glej Obnova_Ustavljanje-po-tipkovnici_26.8.7.docx, razdelek 17. */
            html { scroll-padding-top: calc(var(--povzetek-h, 192px) + 8px); }
            .col-plain .result-box { height: auto; padding: 10px 12px; }
            .result-caption { margin-bottom: 6px; padding-bottom: 4px; }
            .result-item { margin-bottom: 4px; }
            .result-sum { margin-top: 8px; padding-top: 6px; }

            .col.zaprt > .col-header {
                display: block;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.4;
            }
            /* Puscica se poravna z naslovom, ne s sredino celotnega traku */
            /* Kljukica stoji pri naslovu v obeh stanjih. 23 px = 10 px roba
               stolpca + 4 px zamika naslova + polovica vrstice. */
            .col-header::after { top: 23px; }

            /* Rob stolpca je na telefonu 10 px, zato je tudi zrak pod naslovom 14
               (10 + 4 zamika), ne 19 kot na Macu. */
            .col-header { padding-bottom: 14px; }

            /* Prazno mesto stolpca Davki je na telefonu odvec: stolpci stojijo eden
               pod drugim in prazna vrstica podvoji razmik med 1. in 3. stolpcem
               (izmerjeno 123 proti 61 pikam). Na Macu ostane - tam poravnava
               stolpce z zgornjo vrsto. */
            .col-empty { display: none; }

            /* Podvojeno polje z zneski v drugi vrstici na telefonu ni potrebno */
            .row-second > .col-plain { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sklope nariše koda (korak 2). Tu je samo mesto, kamor jih postavi. -->
    <div id="app"></div>

    <script>
        const MAX_TAX = 100;        // davek nad 100 % ni smiseln
        const SLIDER_BASE_MAX = 30; // privzeti obseg drsnika (za natančno nastavljanje nizkih stopenj)
        const MAX_DISPLAY = 1e15;   // nad to mejo znesek ni več smiseln (in bi razbil prikaz)

        // Privzeta vsebina stolpcev (1g): ENA vrstica z imenom, znesek 0.
        // Prazna druga vrstica je odpadla - nove vrstice dodate z gumbom "+".
        // Osnova ima dve imeni: neobdavcen del je Honorar, obdavcen Placilo.
        const DEFAULT_TAXES = [{ name: 'Davek', val: 0 }];
        const DEFAULT_COSTS = [{ name: 'Stroški', val: 0 }];
        const DEFAULT_BASES = [{ name: 'Honorar', val: 0 }];
        const DEFAULT_BASES_TAXED = [{ name: 'Plačilo', val: 0 }];

        const TRAVEL_FIELDS = ['km', 'poraba', 'gorivo', 'amort'];

        // Štirje izračuni: vsaka tabela ima vrstico z neobdavčenim in vrstico z obdavčenim prihodkom.
        // Obdavčen prihodek (taxed: true) nima stolpca z davki - davek je že plačan.
        // baseId je oznaka NEKDANJEGA enega samega polja osnove. Odslej je osnova stolpec
        // vrstic (kot stroški), zato ime živi le še kot ključ, pod katerim so shranjeni
        // starejši podatki - glej prevod v loadFromStorage.
        const CALCS = [
            { n: 1, table: 1, taxed: false, baseId: 'net1',   dir: 'toGross' },
            { n: 3, table: 1, taxed: true,  baseId: 'net3',   dir: 'toGross' },
            { n: 2, table: 2, taxed: false, baseId: 'gross2', dir: 'toNet' },
            { n: 4, table: 2, taxed: true,  baseId: 'gross4', dir: 'toNet' }
        ];

        const TABLES = [
            { n: 1, untaxed: 1, taxed: 3 },
            { n: 2, untaxed: 2, taxed: 4 }
        ];

        // ---------- Sestavljanje sklopov (korak 2) ----------
        // Do tu so bili štirje sklopi napisani na roko: 321 vrstic telesa strani,
        // v katerih se je isti zapis ponovil štirikrat z majhnimi razlikami.
        // Odslej stoji v datoteki samo opis razlik, sklope pa nariše koda.
        // Na zaslonu se ne spremeni nič - to je pogoj koraka.
        //
        // Številk izračunov (1 in 3 v prvi tabeli, 2 in 4 v drugi) tu NI: koda jih
        // vzame iz CALCS. Tako sta oštevilčenje in shranjevanje na enem samem mestu.

        const SKLOPI = [
            { t: 1, ime: 'NETO → BRUTO', levo: 'NETO',  desno: 'BRUTO', enota: 'Neto'  },
            { t: 2, ime: 'BRUTO → NETO', levo: 'BRUTO', desno: 'NETO',  enota: 'Bruto' }
        ];

        // Štirje stolpci ene vrstice, po vrsti. Beseda v 'vrsta' je hkrati oznaka
        // seštevkov: sum-<vrsta>-N, share-<vrsta>-N, basis-<vrsta>-N.
        // Naslov prvega stolpca ni zapisan, ker se sestavi iz besede sklopa:
        // "1. Neobdavčen Neto", "1. Obdavčen Bruto" in tako naprej.
        // Stolpec Davki stoji samo v neobdavčeni vrstici - v obdavčeni je davek
        // že plačan in na njegovem mestu ostane prazno polje, ki drži poravnavo.
        const STOLPCI = [
            { vrsta: 'base',   naslov: null,               vsebnik: 'base-container-',  vrstice: true,
              napis: 'Skupaj osnova',  sestevek: '0,00 €', delez: '+0,00 %', osnova: 'Do 0,00 €' },
            { vrsta: 'tax',    naslov: '2. Davki (%)',     vsebnik: 'taxes-container-', vrstice: false, samoNeobdavcen: true,
              napis: 'Skupaj davek',   sestevek: '0,00 %', delez: '0,00 €',  osnova: 'Od 0,00 €' },
            { vrsta: 'costs',  naslov: '3. Drugi stroški', vsebnik: 'costs-container-', vrstice: true,
              napis: 'Skupaj stroški', sestevek: '0,00 €', delez: '0,00 %',  osnova: 'Od 0,00 €' },
            { vrsta: 'travel', naslov: '4. Potni stroški', pot: true,
              napis: 'Skupaj pot',     sestevek: '0,00 €', delez: '0,00 %',  osnova: 'Od 0,00 €' }
        ];

        // Štiri stalna polja stolpca s potjo. Oznake polj so v TRAVEL_FIELDS,
        // tu stojijo njihovi napisi in razlage ob dotiku.
        const POT_VRSTICE = [
            { polje: 'km',     napis: 'km' },
            { polje: 'poraba', napis: 'Poraba l/100 km' },
            { polje: 'gorivo', napis: 'Cena g. €/l',       opis: 'Cena goriva.' },
            { polje: 'amort',  napis: 'Amortiz. €/100 km', opis: 'Amortizacija. Znesek vzdrževanja na 100 km.' }
        ];

        function potPolja(n) {
            return POT_VRSTICE.map(v =>
                '<label' + (v.opis ? ' title="' + v.opis + '"' : '') + '>' + v.napis + '</label>' +
                '<input type="text" inputmode="decimal" class="num-field nonneg" id="' + v.polje + n + '" value="0">'
            ).join('');
        }

        // Vrstice v stolpcih (honorarji, davki, stroški) tu ne nastanejo - te riše
        // loadFromStorage ob odprtju strani, tako kot doslej. Tu nastane le vsebnik.
        function sestaviStolpec(s, sklop, c) {
            if (s.samoNeobdavcen && c.taxed) return '<div class="col-empty" aria-hidden="true"></div>';
            const naslov = s.naslov || ('1. ' + (c.taxed ? 'Obdavčen ' : 'Neobdavčen ') + sklop.enota);
            const jedro = s.pot
                ? '<div class="pot-polja">' + potPolja(c.n) + '</div>'
                : '<div id="' + s.vsebnik + c.n + '"' + (s.vrstice ? ' class="vrstice"' : '') + '></div>';
            return '<div class="col">' +
                '<div class="col-header">' + naslov + '</div>' +
                jedro +
                '<div class="summary-block">' +
                    '<div class="sum-label">' + s.napis + '</div>' +
                    '<div class="mini-result" id="sum-' + s.vrsta + '-' + c.n + '">' + s.sestevek + '</div>' +
                    '<div class="share-line" id="share-' + s.vrsta + '-' + c.n + '">' + s.delez + '</div>' +
                    '<div class="share-line" id="basis-' + s.vrsta + '-' + c.n + '">' + s.osnova + '</div>' +
                '</div>' +
            '</div>';
        }

        // Povzetek visi na ŠTEVILKI TABELE, ne izračuna: obe vrstici sklopa kažeta
        // ista zneska. Zato je v obeh vrsticah enak in se v spodnji le ponovi.
        function sestaviPovzetek(sklop) {
            const vrstica = (razred, oznaka, znak, kaj) =>
                '<div class="result-item' + razred + '">' +
                    '<span class="ikona' + (kaj === 'untaxed' ? ' ikona-neobdavcen' : '') +
                        '" role="img" aria-label="' + oznaka + '">' + znak + '</span>' +
                    '<div class="result-osnova osn-' + kaj + '-' + sklop.t + '">0</div>' +
                    '<div class="result-value tot-' + kaj + '-' + sklop.t + '">0</div>' +
                '</div>';
            return '<div class="col col-plain"><div class="result-box">' +
                '<div class="result-caption">' +
                    '<span class="cap-evro">€</span>' +
                    '<span class="cap-levo">' + sklop.levo + '</span>' +
                    '<span class="cap-desno">' + sklop.desno + '</span>' +
                '</div>' +
                vrstica('', 'Neobdavčen', '%', 'untaxed') +
                vrstica('', 'Obdavčen', '%', 'taxed') +
                vrstica(' result-sum', 'Skupaj', 'Σ', 'total') +
            '</div></div>';
        }

        // Prva vrstica sklopa je neobdavčena, druga obdavčena - vrstni red prevzame
        // iz CALCS. Druga vrstica nosi razred row-second, po katerem jo loči slog.
        function sestaviSklope() {
            const mesto = document.getElementById('app');
            if (!mesto) return;
            mesto.innerHTML = SKLOPI.map(sklop => {
                const vrstice = CALCS.filter(c => c.table === sklop.t).map((c, i) =>
                    '<div class="calc-grid' + (i ? ' row-second' : '') + '">' +
                        STOLPCI.map(s => sestaviStolpec(s, sklop, c)).join('') +
                        sestaviPovzetek(sklop) +
                    '</div>'
                ).join('');
                return '<div class="container">' +
                    '<h2 class="sklop-naslov">' +
                        '<span class="sklop-ime">' + sklop.ime + '</span>' +
                        '<span class="sklop-znesek tot-total-' + sklop.t + '">0</span>' +
                    '</h2>' + vrstice +
                '</div>';
            }).join('');
        }

        // ---------- Branje števil ----------
        // Razume slovenski zapis: vejica kot decimalno ločilo, pika/presledek kot ločilo tisočic,
        // odvečne presledke, nedeljive presledke, apostrofe in znak €.
        // POZOR: vejico mora razumeti tudi naprej, čeprav je ni več mogoče vtipkati -
        // kalkulator bere nazaj svoje lastne oblikovane izpise ("1.234,56").
        function parseNum(raw) {
            if (raw === null || raw === undefined) return 0;
            let s = String(raw).trim();
            if (!s) return 0;
            s = s.replace(/[\s   '’`€]/g, '');
            const lastComma = s.lastIndexOf(',');
            const lastDot = s.lastIndexOf('.');
            if (lastComma !== -1 && lastDot !== -1) {
                if (lastComma > lastDot) {
                    s = s.replace(/\./g, '').replace(/,/g, '.');   // 1.234,56 -> 1234.56
                } else {
                    s = s.replace(/,/g, '');                        // 1,234.56 -> 1234.56
                }
            } else if (lastComma !== -1) {
                const parts = s.split(',');
                s = parts.length === 2 ? parts[0] + '.' + parts[1] : s.replace(/,/g, '');
            } else if (lastDot !== -1) {
                if (s.split('.').length - 1 > 1) s = s.replace(/\./g, ''); // 1.234.567 -> 1234567
            }
            const n = parseFloat(s);
            return isFinite(n) ? n : 0;
        }

        function clamp(v, lo, hi) {
            if (!isFinite(v)) return lo;
            return v < lo ? lo : (v > hi ? hi : v);
        }

        function getVal(id) {
            return vrednostPolja(document.getElementById(id));
        }

        // Nenegativna polja (osnova, kilometri, poraba, gorivo, amortizacija)
        function getNonNeg(id) {
            return Math.max(0, getVal(id));
        }

        function setVal(id, val) {
            const el = document.getElementById(id);
            if (el && val !== undefined && val !== null) vpisiSurovo(el, val);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isShowable(n) {
            return isFinite(n) && Math.abs(n) <= MAX_DISPLAY;
        }

        // ---------- Zapis števil (računovodski, slovenski) ----------
        // Pika loči tisočice, vejica stoji pred decimalkami: 20400 -> "20.400,00".
        // Pri 0 decimalkah se decimalke ODREŽEJO (proti nič) in vejice ni: -> "20.400".
        function fmtSL(n, decimalke) {
            const d = (decimalke === undefined) ? 2 : decimalke;
            if (!isFinite(n)) return String(n);
            const abs = Math.abs(n);
            const zapis = d > 0 ? abs.toFixed(d) : String(Math.trunc(abs));
            const pika = zapis.indexOf('.');
            let celi = pika === -1 ? zapis : zapis.slice(0, pika);
            const del = pika === -1 ? '' : zapis.slice(pika + 1);
            // pika na vsake tri števke z desne (celi so tu same števke)
            celi = celi.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            // -0,004 se pri dveh decimalkah izpiše kot 0,00 - brez minusa
            const jeNic = /^0$/.test(celi) && /^0*$/.test(del);
            return ((n < 0 && !jeNic) ? '-' : '') + celi + (del ? ',' + del : '');
        }

        function fmtMoney(n) {
            return isShowable(n) ? fmtSL(n, 2) + ' €' : 'ni izračunljivo';
        }

        // Povzetek je pripomoček za odločanje, ne računovodstvo: decimalke se
        // ODREŽEJO (proti nič), ne zaokrožijo - 1298,99 se izpiše kot 1.298.
        // Znak za evro stoji enkrat v glavi, zato ga tu ni.
        const NEIZRACUNLJIVO = '???';
        function fmtCelo(n) {
            return isShowable(n) ? fmtSL(n, 0) : NEIZRACUNLJIVO;
        }

        // ---------- Zapis v vnosnih poljih ----------
        // Polje je oblikovano, dokler vanj ne kliknemo; med urejanjem je surovo.
        // Tako uporabnik med tipkanjem nikoli ne vidi pik za tisočice in jih ne
        // more pomotoma prepisati nazaj - "1.234" bi se sicer prebralo kot 1,234.
        function jeStevilskoPolje(el) {
            return !!(el && el.className &&
                      String(el.className).indexOf('num-field') !== -1);
        }

        // Koliko decimalk naj polje ohrani, da 20400 ne postane 20.400,00.
        // Pri enem samem ločilu je to, kar stoji za njim; pri več ločilih so
        // pike ločila tisočic, zato šteje samo vejica.
        function steviloDecimalk(vrednost) {
            const s = String(vrednost).trim();
            const locil = (s.match(/[.,]/g) || []).length;
            const m = (locil === 1) ? s.match(/[.,](\d+)$/) : s.match(/,(\d+)$/);
            return m ? Math.min(m[1].length, 6) : 0;
        }

        // Strojna vrednost polja.
        //
        // Iz besedila je ni vedno mogoče razbrati: niz "1.500" pomeni surovo
        // 1,5 (pika je decimalno ločilo), oblikovano pa 1500 (pika loči
        // tisočice). Niza sta enaka, pomena različna, zato razlike ni mogoče
        // ugotoviti iz besedila. Pravo vrednost hranimo v atributu data-num.
        const ATRIBUT_VREDNOST = 'data-num';

        function vrednostPolja(el) {
            if (!el) return 0;
            if (el.getAttribute) {
                const shranjena = el.getAttribute(ATRIBUT_VREDNOST);
                if (shranjena !== null && shranjena !== undefined && shranjena !== '') {
                    const n = parseFloat(shranjena);
                    if (isFinite(n)) return n;
                }
            }
            return parseNum(el.value);
        }

        // Vsak zapis surovega besedila v številsko polje gre skozi tu,
        // da shranjena vrednost nikoli ne zastari.
        function vpisiSurovo(el, besedilo) {
            if (!el) return;
            el.value = String(besedilo);
            if (el.setAttribute) {
                el.setAttribute(ATRIBUT_VREDNOST, String(parseNum(el.value)));
            }
        }

        // Strojni zapis za shranjevanje: prazno polje ostane prazno.
        function strojniZapis(el) {
            if (!el || String(el.value).trim() === '') return '';
            return String(vrednostPolja(el));
        }

        // Strojni zapis: pika je decimalno ločilo, ločil tisočic ni.
        function surovoPolje(vrednost) {
            if (String(vrednost).trim() === '') return '';
            const n = parseNum(vrednost);
            if (!isFinite(n)) return '';
            return String(n);
        }

        function oblikovanoPolje(vrednost) {
            if (String(vrednost).trim() === '') return '';
            const n = parseNum(vrednost);
            if (!isShowable(n)) return String(vrednost);
            return fmtSL(n, steviloDecimalk(vrednost));
        }

        // Po nalaganju poenotimo zapis v vseh številskih poljih hkrati.
        // Vrednost preberemo, DOKLER je besedilo še surovo, in šele nato oblikujemo.
        function oblikujVsaPolja() {
            document.querySelectorAll('.num-field').forEach(el => {
                const surovo = el.value;
                if (el.setAttribute) {
                    el.setAttribute(ATRIBUT_VREDNOST, String(parseNum(surovo)));
                }
                el.value = oblikovanoPolje(surovo);
            });
        }

        // Informativni vrstici pod seštevkom stolpca:
        //   'pct'    -> delež zneska v končnem znesku ("16,41 %")             [stolpca 3 in 4]
        //   'eur'    -> znesek v evrih ("64,78 €"), ker je seštevek že v %     [stolpec 2 - davki]
        //   'change' -> sprememba od zneska stolpca DO končnega zneska,        [stolpec 1]
        //               s predznakom: 1. tabela "+53,85 %" (koliko prišteti),
        //                             2. tabela "-25,50 %" (koliko odšteti)
        //               Izhodišče (100 %) je znesek stolpca, zato se vrstica pod njim glasi "Do ...".
        // Druga vrstica: stolpec 1 "Do <končni znesek> €", stolpci 2-4 "Od <končni znesek> €".
        function showShare(kind, calcNum, amount, finalAmount, mode, basisLabel) {
            const shareEl = document.getElementById(`share-${kind}-${calcNum}`);
            const basisEl = document.getElementById(`basis-${kind}-${calcNum}`);
            if (!shareEl || !basisEl) return;

            if (mode === 'eur') {
                shareEl.innerText = isShowable(amount) ? fmtSL(amount, 2) + ' €' : '– €';
            } else if (mode === 'change') {
                // 500 € + 53,85 % = 769,23 €   /   500 € - 25,50 % = 372,50 €
                const canChange = isShowable(amount) && isShowable(finalAmount) && amount > 0;
                if (canChange) {
                    const d = (finalAmount / amount - 1) * 100;
                    shareEl.innerText = (d >= 0 ? '+' : '') + fmtSL(d, 2) + ' %';
                } else {
                    shareEl.innerText = '– %';
                }
            } else {
                const canShare = isShowable(amount) && isShowable(finalAmount) && finalAmount > 0;
                shareEl.innerText = canShare ? fmtSL(amount / finalAmount * 100, 2) + ' %' : '– %';
            }

            basisEl.innerText = (basisLabel || 'Od') + ' ' + (isShowable(finalAmount) ? fmtSL(finalAmount, 2) + ' €' : '–');
        }

        // ---------- Gumbi vrstic ----------
        // Od koraka 1g: zeleni "+" NI vec v vrstici. Vsaka vrstica ima rdeci "-",
        // gumb "+" pa stoji sam pod vrsticami, v svoji vrstici brez vnosnih polj.
        // Posledica: stolpec sme ostati cisto brez vrstic. Nazaj jih dobite z "+"
        // ali s kosem - ta vrne privzeto vrstico z imenom.
        // Oznaka izračuna je zadnja števka v imenu vsebnika (npr. "costs-container-3" -> 3).
        function calcNumOf(containerId) {
            const m = String(containerId).match(/(\d+)$/);
            return m ? parseInt(m[1], 10) : 1;
        }

        // Tri vrste vrstic z enakim vedenjem. Preglednica je krajsa in bolj varna od
        // verige pogojev: nova vrsta se doda na enem mestu. Funkcije so deklarirane
        // nize v datoteki, kar je v redu - deklaracije veljajo v celotnem sklopu.
        const VRSTICE = {
            base: { add: addBaseRow, remove: removeBaseRow },
            tax:  { add: addTaxRow,  remove: removeTaxRow },
            cost: { add: addCostRow, remove: removeCostRow }
        };

        // Vsaka vrstica ima rdeci "-". Izjeme ni vec: pravilo "zadnja vrstica je
        // drugacna" je s korakom 1g odpadlo.
        function setRowButton(btn, kind) {
            btn.className = 'btn-action btn-remove';
            btn.innerText = '-';
            btn.title = 'Odstrani vrstico';
            btn.onclick = function () { VRSTICE[kind].remove(btn); };
        }

        // Gumb "+" je zadnji otrok vsebnika. Ce ga se ni, ga naredimo; sicer ga
        // appendChild samo prestavi na konec - tako je vedno pod zadnjo vrstico,
        // tudi ce je bila vrstica pravkar dodana za njim.
        // Zivi ZNOTRAJ vsebnika iz dveh razlogov: ob zaprtju stolpca se skrije
        // skupaj z vrsticami, rebuild* pa ga pocisti skupaj z njimi.
        function zagotoviGumbDodaj(container, kind, containerId) {
            let vrstica = container.querySelector('.add-row');
            if (!vrstica) {
                vrstica = document.createElement('div');
                vrstica.className = 'add-row';
                vrstica.innerHTML = '<button type="button" class="btn-action btn-add">+</button>';
            }
            const btn = vrstica.querySelector('button');
            if (btn) {
                btn.title = 'Dodaj vrstico';
                btn.setAttribute('aria-label', 'Dodaj vrstico');
                btn.onclick = function () { VRSTICE[kind].add(containerId); };
            }
            container.appendChild(vrstica);
        }

        function refreshButtons(containerId, kind) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.querySelectorAll('.cost-row').forEach(row => {
                const btn = row.querySelector('button');
                if (btn) setRowButton(btn, kind);
            });
            zagotoviGumbDodaj(container, kind, containerId);
            // Dodana ali odstranjena vrstica je sprememba stolpca: kos se odloci znova.
            // Ob nalaganju strani gumbov se ni - osvezitev takrat ne stori nicesar.
            osveziKose(container);
        }

        // ---------- Osnova (honorarji) ----------
        // Isti vzorec kot stroški: vsaka vrstica ima ime in znesek, zneski se seštejejo.
        // Ime (npr. delodajalec) vpiše uporabnik in na izračun ne vpliva.
        // Rezultat je enak kot pri enem samem znesku: davek je množenje, zato je
        // vseeno, ali seštejemo pred obračunom ali po njem (800 + 400 = 1200).
        function makeBaseRow(name, val, calcNum) {
            const row = document.createElement('div');
            row.className = 'cost-row';
            row.innerHTML = `
                <input type="text" class="name-field" value="${escapeHtml(name)}">
                <input type="text" inputmode="decimal" class="base-val-${calcNum} num-field nonneg" value="${escapeHtml(val)}" data-num="${escapeHtml(String(parseNum(val)))}">
                <button class="btn-action"></button>
            `;
            return row;
        }

        function addBaseRow(containerId) {
            const calcNum = calcNumOf(containerId);
            document.getElementById(containerId).appendChild(makeBaseRow('', 0, calcNum));
            refreshButtons(containerId, 'base');
            calculateAll();
        }

        function removeBaseRow(btn) {
            const row = btn.parentElement;
            if (!row || !row.parentElement) return;
            const containerId = row.parentElement.id;
            row.remove();
            refreshButtons(containerId, 'base');
            calculateAll();
        }

        function rebuildBases(containerId, calcNum, basesArr) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            basesArr.forEach(item => {
                container.appendChild(makeBaseRow(safeName(item), safeVal(item), calcNum));
            });
            refreshButtons(containerId, 'base');
        }

        // ---------- Stroški ----------
        function makeCostRow(name, val, calcNum) {
            const row = document.createElement('div');
            row.className = 'cost-row';
            row.innerHTML = `
                <input type="text" class="name-field" value="${escapeHtml(name)}">
                <input type="text" inputmode="decimal" class="cost-val-${calcNum} num-field nonneg" value="${escapeHtml(val)}" data-num="${escapeHtml(String(parseNum(val)))}">
                <button class="btn-action"></button>
            `;
            return row;
        }

        function addCostRow(containerId) {
            const calcNum = calcNumOf(containerId);
            document.getElementById(containerId).appendChild(makeCostRow('', 0, calcNum));
            refreshButtons(containerId, 'cost');
            calculateAll();
        }

        function removeCostRow(btn) {
            const row = btn.parentElement;
            if (!row || !row.parentElement) return;
            const containerId = row.parentElement.id;
            row.remove();
            refreshButtons(containerId, 'cost');
            calculateAll();
        }

        function rebuildCosts(containerId, calcNum, costsArr) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            costsArr.forEach(cost => {
                container.appendChild(makeCostRow(safeName(cost), safeVal(cost), calcNum));
            });
            refreshButtons(containerId, 'cost');
        }

        // ---------- Davki (vsaka vrstica ima svoj drsnik) ----------
        // Ločeno štetje po kalkulatorju, da so oznake polj predvidljive (taxNum1_0, taxNum1_1, ...)
        const taxUidSeq = { 1: 0, 2: 0 };

        function appendTaxEntry(containerId, calcNum, name, val) {
            const container = document.getElementById(containerId);
            const uid = taxUidSeq[calcNum]++;
            const numId = `taxNum${calcNum}_${uid}`;
            const rangeId = `taxRange${calcNum}_${uid}`;

            const row = document.createElement('div');
            row.className = 'cost-row';
            row.innerHTML = `
                <input type="text" class="name-field" value="${escapeHtml(name)}">
                <input type="text" inputmode="decimal" class="tax-val-${calcNum} num-field" id="${numId}" data-pair="${rangeId}" value="${escapeHtml(val)}" data-num="${escapeHtml(String(parseNum(val)))}">
                <button class="btn-action"></button>
            `;
            container.appendChild(row);

            const range = document.createElement('input');
            range.type = 'range';
            range.id = rangeId;
            range.min = '0';
            range.step = '1';   // drsnik se premika po celih odstotkih
            range.setAttribute('data-pair', numId);
            container.appendChild(range);

            syncSliderTo(document.getElementById(numId)); // nastavi obseg in vrednost drsnika
        }

        function addTaxRow(containerId) {
            appendTaxEntry(containerId, calcNumOf(containerId), '', 0);
            refreshButtons(containerId, 'tax');
            calculateAll();
        }

        // Vrstica davka in njen drsnik se vedno odstranita skupaj
        function removeTaxRow(btn) {
            const row = btn.parentElement;
            if (!row || !row.parentElement) return;
            const containerId = row.parentElement.id;
            const slider = row.nextElementSibling;
            row.remove();
            if (slider && slider.type === 'range') slider.remove();
            refreshButtons(containerId, 'tax');
            calculateAll();
        }

        function rebuildTaxes(containerId, calcNum, taxesArr) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            taxUidSeq[calcNum] = 0; // stolpec je prazen, štetje lahko začnemo znova
            taxesArr.forEach(tax => {
                appendTaxEntry(containerId, calcNum, safeName(tax), safeVal(tax));
            });
            refreshButtons(containerId, 'tax');
        }

        // Obrambna pretvorba shranjenih vnosov (podatki iz localStorage so lahko poškodovani)
        function safeName(item) {
            if (!item || typeof item !== 'object') return '';
            return (item.name === null || item.name === undefined) ? '' : String(item.name);
        }
        function safeVal(item) {
            if (!item || typeof item !== 'object') return 0;
            const t = typeof item.val;
            return (t === 'string' || t === 'number') ? item.val : 0;
        }
        // Prazen seznam NI isto kot manjkajoc. Od koraka 1g sme stolpec ostati brez
        // vrstic; ce bi prazen seznam pomenil "uporabi privzeto", bi se izbrisane
        // vrstice ob osvezitvi strani same vrnile. Privzeto velja le takrat, kadar
        // zapisa sploh ni ali je pokvarjen.
        function rowsOr(arr, fallback) {
            return Array.isArray(arr) ? arr : fallback;
        }

        // Koliko proge je zapolnjene. Safari zapolnjenega dela ne riše sam,
        // ko mu progo prebarvamo, zato mu mejo povemo tu.
        function osveziProgo(slider) {
            if (!slider || !slider.style) return;
            const max = parseNum(slider.max) || 1;
            const del = clamp(parseNum(slider.value) / max, 0, 1) * 100;
            slider.style.setProperty('--del', del + '%');
        }

        // Drsnik sledi številki; obseg se po potrebi razširi nad privzetih 30 %
        function syncSliderTo(numEl) {
            if (!numEl || !numEl.getAttribute) return;
            const pairId = numEl.getAttribute('data-pair');
            if (!pairId) return;
            const slider = document.getElementById(pairId);
            if (!slider) return;
            const v = clamp(vrednostPolja(numEl), 0, MAX_TAX);
            slider.max = String(Math.max(SLIDER_BASE_MAX, Math.ceil(v)));
            slider.value = String(Math.round(v));   // ročica stoji na celem odstotku
            osveziProgo(slider);
        }

        // ---------- Shranjevanje ----------
        function collectRows(selector, numClass) {
            const out = [];
            document.querySelectorAll(selector).forEach(row => {
                const nameEl = row.querySelector('.name-field');
                const numEl = row.querySelector('.' + numClass);
                if (!nameEl || !numEl) return;
                out.push({ name: nameEl.value, val: strojniZapis(numEl) });
            });
            return out;
        }

        // Shranimo strojni zapis (pika = decimalno ločilo, brez ločil tisočic).
        // Prikazani zapis bi bil dvoumen: "20.400" bi se ob naslednjem branju
        // prebral kot 20,4 - torej tisočkrat premalo.
        function rawVal(id) {
            return strojniZapis(document.getElementById(id));
        }

        function saveToStorage() {
            const data = {};
            CALCS.forEach(c => {
                data['bases' + c.n] = collectRows(`#base-container-${c.n} .cost-row`, 'base-val-' + c.n);
                TRAVEL_FIELDS.forEach(f => { data[f + c.n] = rawVal(f + c.n); });
                data['costs' + c.n] = collectRows(`#costs-container-${c.n} .cost-row`, 'cost-val-' + c.n);
                if (!c.taxed) {
                    data['taxes' + c.n] = collectRows(`#taxes-container-${c.n} .cost-row`, 'tax-val-' + c.n);
                }
            });
            try {
                localStorage.setItem('kalkulatorCen', JSON.stringify(data));
            } catch (e) {
                console.error('Podatkov ni bilo mogoče shraniti', e);
            }
        }

        function readStorage() {
            let saved = null;
            try {
                saved = localStorage.getItem('kalkulatorCen');
            } catch (e) {
                console.error('Do shranjenih podatkov ni mogoče dostopati', e);
                return null;
            }
            if (!saved) return null;
            let data = null;
            try {
                data = JSON.parse(saved);
            } catch (e) {
                console.error('Shranjeni podatki so poškodovani, uporabljam privzete vrednosti', e);
                return null;
            }
            if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
            return data;
        }

        // Zgradi vse štiri izračune: iz shranjenih podatkov, sicer iz privzetih vrednosti
        function loadFromStorage() {
            const data = readStorage() || {};

            CALCS.forEach(c => {
                // Prevod starejsih podatkov: osnova je bila ena sama stevilka (npr. net1),
                // odslej je seznam vrstic. Znesek postavimo v prvo vrstico, ime pa vpise
                // uporabnik sam. Brez tega bi zneski ob prvem odprtju izginili.
                const privzetaOsnova = c.taxed ? DEFAULT_BASES_TAXED : DEFAULT_BASES;
                const legacyBases = (data[c.baseId] !== undefined && data[c.baseId] !== null)
                    ? [{ name: privzetaOsnova[0].name, val: data[c.baseId] }]
                    : privzetaOsnova;
                rebuildBases('base-container-' + c.n, c.n, rowsOr(data['bases' + c.n], legacyBases));

                TRAVEL_FIELDS.forEach(f => setVal(f + c.n, data[f + c.n]));

                rebuildCosts('costs-container-' + c.n, c.n, rowsOr(data['costs' + c.n], DEFAULT_COSTS));

                if (!c.taxed) {
                    // Migracija starih podatkov (en sam taxNum) v nov seznam davkov
                    const legacy = data['taxNum' + c.n] !== undefined
                        ? [{ name: 'Davek', val: data['taxNum' + c.n] }]
                        : DEFAULT_TAXES;
                    rebuildTaxes('taxes-container-' + c.n, c.n, rowsOr(data['taxes' + c.n], legacy));
                }
            });
        }

        // ---------- Izračun ----------
        // Davki se obračunavajo ZAPOREDNO (davek na davek), ne seštevajo:
        //   Neto  = Bruto * (1-d1) * (1-d2) * ... - (stroški + pot)
        //   Bruto = (Neto + stroški + pot) / [(1-d1) * (1-d2) * ...]
        function taxFactor(calcNum) {
            let factor = 1;
            document.querySelectorAll('.tax-val-' + calcNum).forEach(el => {
                const p = clamp(vrednostPolja(el), 0, MAX_TAX);
                factor *= (1 - p / 100);
            });
            return factor;
        }

        // Osnova je lahko samo 0 ali več (negativen honorar ni dovoljen)
        function sumBases(calcNum) {
            let sum = 0;
            document.querySelectorAll('.base-val-' + calcNum).forEach(el => { sum += Math.max(0, vrednostPolja(el)); });
            return sum;
        }

        // Stroški so lahko samo 0 ali več (negativen strošek ni dovoljen)
        function sumCosts(calcNum) {
            let sum = 0;
            document.querySelectorAll('.cost-val-' + calcNum).forEach(el => { sum += Math.max(0, vrednostPolja(el)); });
            return sum;
        }

        function travelCost(calcNum) {
            const km = getNonNeg('km' + calcNum);
            return (km / 100) * ((getNonNeg('poraba' + calcNum) * getNonNeg('gorivo' + calcNum)) + getNonNeg('amort' + calcNum));
        }

        // Zapiše znesek v vsa polja z danim razredom (polje z zneski se ponovi v obeh vrsticah)
        function showTotal(cls, n) {
            const ok = isShowable(n);
            document.querySelectorAll('.' + cls).forEach(el => {
                el.innerText = fmtCelo(n);
                if (el.classList) {
                    if (ok) el.classList.remove('result-na');
                    else el.classList.add('result-na');
                }
            });
        }

        function calculateAll() {
            const results = {};
            const osnove = {};   // vnesene osnove za levo polovico Povzetka

            CALCS.forEach(c => {
                const base = sumBases(c.n);
                osnove[c.n] = base;
                // Obdavčen prihodek nima stolpca z davki -> faktor ostane 1 (davek je že plačan)
                const factor = taxFactor(c.n);
                const costs = sumCosts(c.n);
                const travel = travelCost(c.n);

                // Napisi stojijo v HTML-ju nad številkami, zato izpišemo samo znesek
                document.getElementById('sum-base-' + c.n).innerText = fmtMoney(base);
                document.getElementById('sum-costs-' + c.n).innerText = fmtMoney(costs);
                document.getElementById('sum-travel-' + c.n).innerText = fmtMoney(travel);
                if (!c.taxed) {
                    document.getElementById('sum-tax-' + c.n).innerText = fmtSL((1 - factor) * 100, 2) + ' %';
                }

                let final;
                if (c.dir === 'toGross') {
                    // Pri 100 % davku bi bil potreben bruto neskončen -> rezultat ni izračunljiv
                    final = factor > 0 ? (base + costs + travel) / factor : NaN;
                } else {
                    final = (base * factor) - (costs + travel);
                }
                results[c.n] = final;

                // Stolpec 1: koliko % je treba znesku prišteti (+) ali odšteti (-) do končnega zneska
                showShare('base', c.n, base, final, 'change', 'Do');
                if (!c.taxed) {
                    const taxAmount = c.dir === 'toGross'
                        ? (isShowable(final) ? final * (1 - factor) : NaN)
                        : base * (1 - factor);
                    showShare('tax', c.n, taxAmount, final, 'eur');
                }
                showShare('costs', c.n, costs, final, 'pct');
                showShare('travel', c.n, travel, final, 'pct');
            });

            // Polje z zneski: neobdavčen, obdavčen in njuna vsota (enako v obeh vrsticah tabele)
            TABLES.forEach(t => {
                const untaxed = results[t.untaxed];
                const taxed = results[t.taxed];
                const total = (isShowable(untaxed) && isShowable(taxed)) ? untaxed + taxed : NaN;
                showTotal('tot-untaxed-' + t.n, untaxed);
                showTotal('tot-taxed-' + t.n, taxed);
                showTotal('tot-total-' + t.n, total);

                // Leva polovica Povzetka: vnesene osnove in njuna vsota
                showTotal('osn-untaxed-' + t.n, osnove[t.untaxed]);
                showTotal('osn-taxed-' + t.n, osnove[t.taxed]);
                showTotal('osn-total-' + t.n, osnove[t.untaxed] + osnove[t.taxed]);
            });

            saveToStorage();
        }

        // ---------- Harmonika (zlaganje stolpcev) ----------
        // Stolpec se zloži v en trak: levo naslov, desno njegov skupni znesek.
        // Ključ stolpca je oznaka njegovega zneska (npr. "sum-costs-3"), zato v HTML
        // ni treba dodajati nobenih novih oznak. Polje s končnimi zneski in prazno
        // mesto v drugi vrstici te oznake nimata, zato harmonika nista.
        const POGLED_KLJUC = 'kalkulatorPogled';   // ločeno od podatkov o izračunu

        // Prva postavka zapisa pove, katere različice je. Zapis brez nje je starejši
        // od pravila "privzeto je vse zaprto" (31. 7. 2026) in opisuje razporeditev,
        // ki je ne poznamo več - zato ga prezremo in uporabimo privzeto stanje.
        // Isti prijem uporabi tudi naslednjič, ko zapis spremeni obliko.
        const OZNAKA_ZAPISA = 'pogled-2';

        function imaRazred(el, ime) {
            if (!el || !el.className) return false;
            return (' ' + el.className + ' ').indexOf(' ' + ime + ' ') !== -1;
        }

        function najdiStarsa(el, razred) {
            while (el && el.nodeType === 1) {
                if (imaRazred(el, razred)) return el;
                el = el.parentElement;
            }
            return null;
        }

        function kljucStolpca(col) {
            const el = col.querySelector('.mini-result');
            const id = el ? el.getAttribute('id') : null;
            return id || null;
        }

        // Doda ali odstrani razred 'zaprt'. Uporablja se za stolpce IN za sklope -
        // razred je isti, razlikujejo se le pravila v slogu.
        function nastaviStolpec(col, odprt) {
            if (odprt) col.classList.remove('zaprt');
            else col.classList.add('zaprt');
        }

        // ---------- Pripravljeno polje ----------
        // Prvi dotik polja ga obarva: prva tipka povozi vso vsebino, kot bi bila
        // oznacena. Pravega oznacevanja ne uporabljamo, ker iPhone ob njem prikaze
        // oblacek "Kopiraj / Prilepi". Drugi dotik pripravljenost umakne in polje
        // se ureja po starem. Nikjer ni ure - testno okolje je ne pozna.
        const RAZRED_PRIPRAVLJENO = 'pripravljeno';
        let vrednostObVstopu = '';   // vsebina polja v trenutku, ko je dobilo fokus
        let pravkarFokusirano = null; // polje, ki je fokus dobilo s tem istim dotikom

        function jeVnosnoPolje(el) {
            if (!el || !el.className) return false;
            const c = String(el.className);
            return c.indexOf('name-field') !== -1 || c.indexOf('num-field') !== -1;
        }

        function odpraviPripravljenost(el) {
            if (el && el.classList) el.classList.remove(RAZRED_PRIPRAVLJENO);
        }

        // Brskalnik je vtipkani znak ze vstavil v staro besedilo. Izluscimo ga iz
        // razlike med starim in novim zapisom in v polju pustimo samo njega.
        // Ce se je besedilo skrajsalo (vrac'alka), je izid prazno polje - enako,
        // kot bi vrac'alka pobrisala oznaceno vsebino.
        function povoziPripravljeno(t) {
            const staro = String(vrednostObVstopu);
            const novo = String(t.value);
            const dodano = novo.length - staro.length;
            if (dodano <= 0) { t.value = ''; return; }
            const konec = (typeof t.selectionStart === 'number') ? t.selectionStart : novo.length;
            t.value = novo.substring(konec - dodano, konec);
        }

        // ---------- Ponastavitev stolpca in razveljavitev ----------
        // Za vsak stolpec hranimo zadnje stanje pred ponastavitvijo. Zapis zivi le,
        // dokler je stran odprta; osvezitev strani ga izbrise.
        const POMNIK = {};
        const POMNIK_DELA = {};
        const VPRASANJE = 'Podatki v stolpcu bodo izbrisani.';
        const VPRASANJE_DEL = 'Podatki VSEH stolpcev bodo izbrisani.';
        const PRIVZETA_POT = ['0', '0', '0', '0'];

        function vrstaStolpca(kljuc) {
            if (!kljuc) return null;
            if (kljuc.indexOf('sum-base-') === 0) return 'base';
            if (kljuc.indexOf('sum-tax-') === 0) return 'tax';
            if (kljuc.indexOf('sum-costs-') === 0) return 'costs';
            if (kljuc.indexOf('sum-travel-') === 0) return 'travel';
            return null;
        }

        function stevilkaStolpca(kljuc) {
            const m = String(kljuc).match(/(\d+)$/);
            return m ? m[1] : null;
        }

        function posnemiStolpec(vrsta, n) {
            if (vrsta === 'base') return collectRows('#base-container-' + n + ' .cost-row', 'base-val-' + n);
            if (vrsta === 'costs') return collectRows('#costs-container-' + n + ' .cost-row', 'cost-val-' + n);
            if (vrsta === 'tax') return collectRows('#taxes-container-' + n + ' .cost-row', 'tax-val-' + n);
            return TRAVEL_FIELDS.map(f => rawVal(f + n));
        }

        // Postavi vsebino stolpca in poskrbi za vse, kar je od nje odvisno.
        // Pri davkih drsnik postavi appendTaxEntry sam: ob vrednosti 0 se obseg
        // skrci nazaj na privzetih 30 %.
        function postaviStolpec(vrsta, n, vsebina) {
            if (vrsta === 'base') rebuildBases('base-container-' + n, n, vsebina);
            else if (vrsta === 'costs') rebuildCosts('costs-container-' + n, n, vsebina);
            else if (vrsta === 'tax') rebuildTaxes('taxes-container-' + n, n, vsebina);
            else TRAVEL_FIELDS.forEach((f, i) => setVal(f + n, vsebina[i]));
            oblikujVsaPolja();
            calculateAll();
            saveToStorage();
        }

        // Stolpca 3 in 4 sta obdavcena dela (glej CALCS). Stevilka stolpca prihaja
        // iz oznake polja in je zato niz - primerjamo prek Number.
        function jeObdavcen(n) {
            const c = CALCS.find(x => x.n === Number(n));
            return !!(c && c.taxed);
        }

        function privzetaVsebina(vrsta, n) {
            if (vrsta === 'base') return jeObdavcen(n) ? DEFAULT_BASES_TAXED : DEFAULT_BASES;
            if (vrsta === 'costs') return DEFAULT_COSTS;
            if (vrsta === 'tax') return DEFAULT_TAXES;
            return PRIVZETA_POT;
        }

        // Prazno polje in nicla sta ista stvar: v polju lahko pise 0 ali pa je
        // prazno, stolpec je v obeh primerih prazen.
        function steviloAli0(v) {
            const n = parseNum(v);
            return isFinite(n) ? n : 0;
        }

        function enakaVsebina(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                const x = a[i], y = b[i];
                if (x && typeof x === 'object') {
                    if (!y || typeof y !== 'object') return false;
                    if (String(x.name) !== String(y.name)) return false;
                    if (steviloAli0(x.val) !== steviloAli0(y.val)) return false;
                } else if (steviloAli0(x) !== steviloAli0(y)) return false;
            }
            return true;
        }

        // Stolpec je v zacetnem stanju, kadar izgleda natanko tako, kot bi po
        // ponastavitvi. Vprasanje ni "so zneski nic", ampak "bi ponastavitev sploh
        // kaj spremenila" - zato bo pravilo veljalo tudi takrat, ko bo stolpec 4
        // svoje zacetne zneske dobival iz Nastavitev (koraka 7 in 8).
        function jeZacetno(col) {
            if (!col) return true;
            const kljuc = kljucStolpca(col);
            const vrsta = vrstaStolpca(kljuc);
            const n = stevilkaStolpca(kljuc);
            if (!vrsta || !n) return true;
            return enakaVsebina(posnemiStolpec(vrsta, n), privzetaVsebina(vrsta, n));
        }

        function jeDelZacetni(mreza) {
            let vse = true;
            if (mreza) zaVsakStolpec(mreza, col => { if (!jeZacetno(col)) vse = false; });
            return vse;
        }

        // Vidnost razveljavitve je svoje stanje: ugasne ze ob prvi tipki, sicer bi
        // cez svez vpis vrnila stare podatke.
        function osveziGumbRazveljavi(col) {
            const gumb = col ? col.querySelector('.btn-razveljavi') : null;
            if (gumb && gumb.style) {
                gumb.style.setProperty('display', POMNIK[kljucStolpca(col)] ? 'flex' : 'none');
            }
        }

        // Kos je siv natanko takrat, kadar v stolpcu ni kaj brisati. Sivina po
        // ponastavitvi in sivina, dokler gori velika razveljavitev, sta s tem
        // POSLEDICI istega pravila in ne vec izjemi v kodi.
        function osveziRazveljavitev(col) {
            if (!col) return;
            osveziGumbRazveljavi(col);
            const kos = col.querySelector('.btn-ponastavi');
            if (kos && kos.classList) {
                if (jeZacetno(col)) kos.classList.add('pasiven');
                else kos.classList.remove('pasiven');
            }
        }

        // Trenutek presoje: ko polje zapustite in ko dodate ali odstranite vrstico.
        // Med tipkanjem se namenoma ne zgodi nic - kos med popravljanjem zneska ne
        // sme utripati. Osvezimo cel del, ker se z enim stolpcem lahko spremeni
        // tudi veliki kos.
        function osveziKose(el) {
            const col = najdiStarsa(el, 'col');
            if (!col) return;
            osveziDel(najdiStarsa(col, 'calc-grid'));
        }

        // ----- cel del (neobdavcen ali obdavcen) -----
        function kljucDela(mreza) {
            const el = mreza ? mreza.querySelector('.mini-result') : null;
            const id = el ? el.getAttribute('id') : null;
            const m = id ? String(id).match(/(\d+)$/) : null;
            return m ? 'del-' + m[1] : null;
        }

        function zaVsakStolpec(mreza, fn) {
            mreza.querySelectorAll('.col').forEach(col => {
                const k = kljucStolpca(col);
                const vrsta = vrstaStolpca(k);

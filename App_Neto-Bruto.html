                if (vrsta) fn(col, k, vrsta, stevilkaStolpca(k));
            });
        }

        function osveziGumbRazveljaviDel(mreza) {
            const gumb = mreza ? mreza.querySelector('.btn-del-razveljavi') : null;
            if (gumb && gumb.style) {
                gumb.style.setProperty('display', POMNIK_DELA[kljucDela(mreza)] ? 'flex' : 'none');
            }
        }

        // Veliki kos ima isto pravilo kot mali: siv je, dokler so vsi stolpci
        // njegovega dela v zacetnem stanju.
        function osveziDel(mreza) {
            if (!mreza) return;
            osveziGumbRazveljaviDel(mreza);
            const kos = mreza.querySelector('.btn-del-ponastavi');
            if (kos && kos.classList) {
                if (jeDelZacetni(mreza)) kos.classList.add('pasiven');
                else kos.classList.remove('pasiven');
            }
            zaVsakStolpec(mreza, col => osveziRazveljavitev(col));
        }

        function ponastaviDel(mreza) {
            const kljuc = kljucDela(mreza);
            if (!kljuc || POMNIK_DELA[kljuc]) return;
            // Pasiven kos ne vprasa in ne shrani praznega stanja v pomnik.
            if (jeDelZacetni(mreza)) return;
            if (typeof confirm === 'function' && confirm(VPRASANJE_DEL) !== true) return;
            const posnetek = {};
            zaVsakStolpec(mreza, (col, k, vrsta, n) => {
                // Ce je bil stolpec ze ponastavljen, si zapomnimo stanje PRED tisto
                // ponastavitvijo - sicer bi velika razveljavitev vrnila prazno.
                posnetek[k] = POMNIK[k] || posnemiStolpec(vrsta, n);
                delete POMNIK[k];
                postaviStolpec(vrsta, n, privzetaVsebina(vrsta, n));
            });
            POMNIK_DELA[kljuc] = posnetek;
            osveziDel(mreza);
        }

        function razveljaviDel(mreza) {
            const kljuc = kljucDela(mreza);
            const posnetek = POMNIK_DELA[kljuc];
            if (!posnetek) return;
            delete POMNIK_DELA[kljuc];
            zaVsakStolpec(mreza, (col, k, vrsta, n) => {
                if (posnetek[k]) postaviStolpec(vrsta, n, posnetek[k]);
            });
            osveziDel(mreza);
        }

        function ponastaviStolpec(col) {
            const kljuc = kljucStolpca(col);
            const vrsta = vrstaStolpca(kljuc);
            const n = stevilkaStolpca(kljuc);
            if (!vrsta || !n) return;
            // Pasiven kos ne stori nicesar in ne vprasa: v stolpcu ni kaj brisati.
            // Stanje po ponastavitvi in stanje pod prizgano veliko razveljavitvijo
            // sta zajeta s tem istim pravilom - stolpec je takrat prazen.
            if (jeZacetno(col)) return;
            // Pomnik hrani stanje pred PRVO ponastavitvijo in ga druga ne sme povoziti.
            if (POMNIK[kljuc]) return;
            // Ce okna z vprasanjem ni (testno okolje), se ponastavitev izvede.
            if (typeof confirm === 'function' && confirm(VPRASANJE) !== true) return;
            POMNIK[kljuc] = posnemiStolpec(vrsta, n);
            postaviStolpec(vrsta, n, privzetaVsebina(vrsta, n));
            osveziRazveljavitev(col);
        }

        function razveljaviStolpec(col) {
            const kljuc = kljucStolpca(col);
            const vsebina = POMNIK[kljuc];
            if (!vsebina) return;
            delete POMNIK[kljuc];
            postaviStolpec(vrstaStolpca(kljuc), stevilkaStolpca(kljuc), vsebina);
            osveziRazveljavitev(col);
        }

        // Vsaka razveljavitev pripada svojemu stolpcu: sprememba v Stroskih
        // pobrise razveljavitev pri Stroskih, tista pri Davkih ostane.
        function pozabiRazveljavitev(el) {
            const col = najdiStarsa(el, 'col');
            if (!col) return;
            const kljuc = kljucStolpca(col);
            if (kljuc && POMNIK[kljuc]) {
                delete POMNIK[kljuc];
                osveziGumbRazveljavi(col);
            }
            // Prvi vpis kamorkoli v del ugasne tudi veliko razveljavitev.
            const mreza = najdiStarsa(col, 'calc-grid');
            const kd = kljucDela(mreza);
            if (kd && POMNIK_DELA[kd]) {
                delete POMNIK_DELA[kd];
                osveziGumbRazveljaviDel(mreza);
            }
        }

        // Gumba nista v HTML: postavi ju skript v vsak stolpec, ki ima seštevek.
        // Tako jih ni treba prepisovati stirinajstkrat in korak 2 jih dobi zastonj.
        const GUMBA_HTML =
            '<button type="button" class="btn-stolpec btn-ponastavi" title="Ponastavi stolpec" aria-label="Ponastavi stolpec">' +
            '<span class="kos" aria-hidden="true"><span class="kos-pokrov"></span><span class="kos-telo"></span></span></button>' +
            '<button type="button" class="btn-stolpec btn-razveljavi" title="Razveljavi ponastavitev" aria-label="Razveljavi ponastavitev">&#8634;</button>';

        const GUMBA_DELA_HTML =
            '<button type="button" class="btn-stolpec btn-ponastavi btn-del-ponastavi" title="Ponastavi vse stolpce" aria-label="Ponastavi vse stolpce">' +
            '<span class="kos" aria-hidden="true"><span class="kos-pokrov"></span><span class="kos-telo"></span></span></button>' +
            '<button type="button" class="btn-stolpec btn-razveljavi btn-del-razveljavi" title="Razveljavi ponastavitev vseh stolpcev" aria-label="Razveljavi ponastavitev vseh stolpcev">&#8634;</button>';

        function postaviGumbeStolpcev() {
            document.querySelectorAll('.col').forEach(col => {
                const kljuc = kljucStolpca(col);
                if (!vrstaStolpca(kljuc)) return;
                const blok = col.querySelector('.summary-block');
                if (!blok || blok.querySelector('.sb-gumbi')) return;

                const zneski = document.createElement('div');
                zneski.className = 'sb-zneski';
                // slice: v brskalniku je children ziva zbirka brez forEach,
                // poleg tega se med prelaganjem krajsa.
                Array.prototype.slice.call(blok.children).forEach(o => zneski.appendChild(o));

                const gumbi = document.createElement('div');
                gumbi.className = 'sb-gumbi';
                gumbi.innerHTML = GUMBA_HTML;

                blok.appendChild(gumbi);
                blok.appendChild(zneski);
                osveziRazveljavitev(col);
            });

            // Gumba za cel del. Vstavljena sta V mrezo kot zadnje polje cez vso
            // sirino - tako sta na Macu pod stolpci, na telefonu pa na dnu sklada.
            document.querySelectorAll('.calc-grid').forEach(mreza => {
                if (!kljucDela(mreza) || mreza.querySelector('.del-gumbi')) return;
                const blok = document.createElement('div');
                blok.className = 'del-gumbi';
                blok.innerHTML = GUMBA_DELA_HTML;
                mreza.appendChild(blok);
                osveziDel(mreza);
            });
        }

        // ---------- Harmonika sklopa (cele tabele) ----------
        // Kljuc sklopa je oznaka njegovega skupnega zneska ("tot-total-1"), zato
        // tudi tu v HTML ni novih oznak.
        //
        // POZOR - zapisujemo ZAPRTE sklope, ne odprtih. Razlog: shranjeno stanje
        // iz starejse razlicice o sklopih ne ve nicesar. Ce bi zapisovali odprte,
        // bi molk starega zapisa pomenil "oba zaprta" in uporabnik bi ob prvem
        // odprtju videl dva prazna naslova. Tako molk pomeni "oba odprta".
        const ZAPRT_PREDPONA = 'zaprt:';

        function kljucSklopa(container) {
            const el = container.querySelector('.sklop-znesek');
            if (!el || !el.className) return null;
            const m = String(el.className).match(/tot-total-(\d+)/);
            return m ? 'sklop-' + m[1] : null;
        }

        // forEach (ne filter): v brskalniku querySelectorAll vrne NodeList,
        // ki filtra nima.
        function zaVsakSklop(fn) {
            document.querySelectorAll('.container').forEach(c => {
                const k = kljucSklopa(c);
                if (k) fn(c, k);
            });
        }

        // Zapis vsebuje dvoje: kljuce ODPRTIH stolpcev in kljuce ZAPRTIH sklopov
        // (ti s predpono). Razlog za razliko je opisan pri ZAPRT_PREDPONA.
        function shraniPogled() {
            const zapis = [OZNAKA_ZAPISA];
            document.querySelectorAll('.col').forEach(col => {
                const k = kljucStolpca(col);
                if (k && !imaRazred(col, 'zaprt')) zapis.push(k);
            });
            zaVsakSklop((c, k) => {
                if (imaRazred(c, 'zaprt')) zapis.push(ZAPRT_PREDPONA + k);
            });
            try {
                localStorage.setItem(POGLED_KLJUC, JSON.stringify(zapis));
            } catch (e) {
                console.error('Stanja stolpcev ni bilo mogoče shraniti', e);
            }
        }

        // PRIVZETO JE VSE ZAPRTO (31. 7. 2026), na vsaki širini zaslona enako.
        // Uporabnik odpre, kar potrebuje, in aplikacija si to zapomni.
        //
        // Zapis je uporaben le, če je seznam IN ima oznako različice. Trije primeri,
        // ko uporaben ni - zapisa ni, prazen je, pokvarjen je - dajo isti izid:
        // aplikacija ne ugiba, ampak vse zapre.
        function naloziPogled() {
            let seznam = null;
            try {
                const raw = localStorage.getItem(POGLED_KLJUC);
                if (raw) {
                    const p = JSON.parse(raw);
                    if (Array.isArray(p) && p.indexOf(OZNAKA_ZAPISA) !== -1) seznam = p;
                }
            } catch (e) {
                seznam = null;
            }

            document.querySelectorAll('.col').forEach(col => {
                const k = kljucStolpca(col);
                if (!k) return;
                nastaviStolpec(col, !!seznam && seznam.indexOf(k) !== -1);
            });

            // Sklopi se zapisujejo obrnjeno (zabeleži se ZAPRTE), zato brez
            // uporabnega zapisa ni podatka o njih - in takrat velja privzeto: zaprto.
            zaVsakSklop((c, k) => {
                const zaprt = seznam ? seznam.indexOf(ZAPRT_PREDPONA + k) !== -1 : true;
                nastaviStolpec(c, !zaprt);
            });
        }

        // ---------- Dogodki ----------
        document.addEventListener('input', function (e) {
            const t = e.target;

            // Prva tipka v pripravljenem polju povozi vso vsebino.
            if (imaRazred(t, RAZRED_PRIPRAVLJENO)) {
                odpraviPripravljenost(t);
                povoziPripravljeno(t);
            }
            // Vsak vpis je sprememba: razveljavitev v tem stolpcu ugasne.
            pozabiRazveljavitev(t);

            // Med tipkanjem je besedilo surovo, zato je zdaj pravi trenutek,
            // da si zapomnimo strojno vrednost polja.
            if (jeStevilskoPolje(t)) {
                // V polju vejice ni: takoj postane pika. Tipke ne zavračamo, ker
                // iPhone pri številski tipkovnici ponuja SAMO vejico - z zavrnitvijo
                // decimalk na telefonu sploh ne bi bilo mogoče vpisati.
                // Pretvorimo, ne izbrišemo: "1,5" mora ostati 1,5 in ne postati 15.
                const besedilo = String(t.value);
                if (besedilo.indexOf(',') !== -1) {
                    if (besedilo.indexOf('.') === -1) {
                        // Običajno tipkanje: "1," -> "1."  in  "1,5" -> "1.5".
                        // Zamenjava je znak za znak, zato kazalec ostane, kjer je bil.
                        const zac = t.selectionStart, kon = t.selectionEnd;
                        t.value = besedilo.replace(/,/g, '.');
                        if (typeof zac === 'number' && typeof t.setSelectionRange === 'function') {
                            try { t.setSelectionRange(zac, kon); } catch (err) { /* ni bistveno */ }
                        }
                    } else {
                        // Pika IN vejica hkrati: prilepljen tuj ali oblikovan zapis
                        // ("1.234,56"). Vrednost prepustimo parseNum, ki tak zapis
                        // razume, polje pa prepišemo v strojno obliko. Brez tega bi
                        // "1.234,56" po zamenjavi vejice postal "1.234.56" = 123456.
                        // Odvečno ločilo na koncu ("1.5,") najprej odstranimo.
                        t.value = String(parseNum(besedilo.replace(/[.,]+$/, '')));
                    }
                }
                if (t.setAttribute) {
                    t.setAttribute(ATRIBUT_VREDNOST, String(parseNum(t.value)));
                }
            }
            if (t && t.getAttribute) {
                const pairId = t.getAttribute('data-pair');
                if (pairId) {
                    const pairEl = document.getElementById(pairId);
                    if (pairEl) {
                        if (pairEl.type === 'range') syncSliderTo(t);       // številka -> drsnik
                        else { vpisiSurovo(pairEl, t.value); osveziProgo(t); }   // drsnik -> številka
                    }
                }
            }
            calculateAll();
        });

        // Ob zapustitvi polja vrednosti normaliziramo (davek 0-100 %, ostala števila >= 0),
        // da uporabnik vidi točno tisto, s čimer kalkulator računa.
        document.addEventListener('change', function (e) {
            const t = e.target;
            if (!t || !t.className) return;
            const cls = String(t.className);
            let changed = false;

            if (cls.indexOf('tax-val-') !== -1) {
                // Zapis pustimo pri miru (npr. "7,5" ali "4.00"); popravimo samo, če je izven 0-100 %
                const raw = vrednostPolja(t);
                const p = clamp(raw, 0, MAX_TAX);
                if (p !== raw) { vpisiSurovo(t, String(p)); changed = true; }
                syncSliderTo(t);
            } else if (cls.indexOf('nonneg') !== -1) {
                if (vrednostPolja(t) < 0) { vpisiSurovo(t, '0'); changed = true; }
            }

            if (changed) calculateAll();
        });

        // Ob vstopu v polje pokažemo surovo številko (brez pik za tisočice),
        // ob izhodu jo oblikujemo nazaj. Uporabljamo focusin/focusout, ker se
        // focus/blur ne dvigata do dokumenta.
        document.addEventListener('focusin', function (e) {
            const t = e.target;
            if (jeStevilskoPolje(t)) {
                t.value = (String(t.value).trim() === '') ? '' : String(vrednostPolja(t));
            }
            // Pripravljenost postavimo SELE za prepisom: sicer bi si zapomnili
            // oblikovan zapis ("1.250,00") namesto tistega, ki je zdaj v polju.
            if (jeVnosnoPolje(t)) {
                vrednostObVstopu = String(t.value);
                t.classList.add(RAZRED_PRIPRAVLJENO);
                pravkarFokusirano = t;
            }
        });

        document.addEventListener('focusout', function (e) {
            const t = e.target;
            odpraviPripravljenost(t);
            if (pravkarFokusirano === t) pravkarFokusirano = null;
            if (jeStevilskoPolje(t)) t.value = oblikovanoPolje(t.value);
            // Zapustitev polja je trenutek, ko se kos odloci, ali je se kaj brisati.
            osveziKose(t);
        });

        // Klik na naslov odpre ali zapre stolpec.
        // Zaprt trak se odzove na klik po vsej širini, odprt samo na naslovu -
        // tako klik v vnosno polje stolpca ne zapre.
        document.addEventListener('click', function (e) {
            // Dotik v vnosno polje: prvi ga je pravkar pripravil, drugi
            // pripravljenost umakne. Klik v polje stolpca nikoli ne odpira.
            if (jeVnosnoPolje(e.target)) {
                if (pravkarFokusirano === e.target) pravkarFokusirano = null;
                else odpraviPripravljenost(e.target);
                return;
            }

            // Dodajanje ali brisanje vrstice je sprememba: razveljavitev ugasne.
            if (imaRazred(e.target, 'btn-action')) { pozabiRazveljavitev(e.target); return; }

            // Gumba celega dela morata biti pred stolpcnima: nosita oba razreda.
            const kosDela = najdiStarsa(e.target, 'btn-del-ponastavi');
            if (kosDela) { ponastaviDel(najdiStarsa(kosDela, 'calc-grid')); return; }

            const razvDela = najdiStarsa(e.target, 'btn-del-razveljavi');
            if (razvDela) { razveljaviDel(najdiStarsa(razvDela, 'calc-grid')); return; }

            // Gumba stolpca. najdiStarsa zajame tudi dotik narisanega kosa.
            const ponastavi = najdiStarsa(e.target, 'btn-ponastavi');
            if (ponastavi) { ponastaviStolpec(najdiStarsa(ponastavi, 'col')); return; }

            const razveljavi = najdiStarsa(e.target, 'btn-razveljavi');
            if (razveljavi) { razveljaviStolpec(najdiStarsa(razveljavi, 'col')); return; }

            // Najprej sklop: klik na naslov tabele zlozi ali razgrne celo tabelo.
            // Naslov stoji ZUNAJ stolpcev, zato se klika ne moreta prekrivati.
            const naslov = najdiStarsa(e.target, 'sklop-naslov');
            if (naslov) {
                const sklop = najdiStarsa(naslov, 'container');
                if (sklop && kljucSklopa(sklop)) {
                    nastaviStolpec(sklop, imaRazred(sklop, 'zaprt'));
                    shraniPogled();
                }
                return;
            }

            const col = najdiStarsa(e.target, 'col');
            if (!col || !kljucStolpca(col)) return;
            const jeZaprt = imaRazred(col, 'zaprt');
            if (!jeZaprt && !najdiStarsa(e.target, 'col-header')) return;
            nastaviStolpec(col, jeZaprt);
            shraniPogled();
        });

        // ---------- Merjenje Povzetka (7. 8. 2026) ----------
        // Izmeri prilepljen Povzetek in njegovo višino zapiše na koren strani.
        // Prebere jo pravilo scroll-padding-top v @media (max-width: 900px).
        //
        // Vsi Povzetki imajo enako zgradbo, zato zadošča najvišji vidni.
        // Zaprt sklop da 0 in v računu ne sodeluje.
        const POVZETKI = '.calc-grid:not(.row-second) > .col-plain';

        function meriPovzetek() {
            const koren = document.documentElement;
            if (!koren || !koren.style) return;   // varovalo: shim korena ne pozna
            const polja = document.querySelectorAll(POVZETKI);
            let najvisji = 0;
            for (let i = 0; i < polja.length; i++) {
                const h = polja[i].offsetHeight || 0;
                if (h > najvisji) najvisji = h;
            }
            if (najvisji > 0) koren.style.setProperty('--povzetek-h', najvisji + 'px');
        }

        // Povzetek zraste ali se skrči sam od sebe: ob zaprtju sklopa, obratu
        // telefona, naloženi pisavi, v koraku 5 ob dodani vrstici variante.
        // Zato se ne meri enkrat, ampak se ga opazuje.
        function opazujPovzetek() {
            meriPovzetek();
            if (typeof ResizeObserver !== 'function') return;   // shim ga ne pozna
            const opazovalec = new ResizeObserver(meriPovzetek);
            const polja = document.querySelectorAll(POVZETKI);
            for (let i = 0; i < polja.length; i++) opazovalec.observe(polja[i]);
        }

        // Ob odprtju strani: najprej nariši sklope, nato zgradi vrstice
        // (shranjene ali privzete) in izračunaj. Vrstni red je pomemben -
        // vse spodnje dela nad stolpci, ki jih postavi sestaviSklope.
        sestaviSklope();
        loadFromStorage();
        postaviGumbeStolpcev();
        oblikujVsaPolja();
        naloziPogled();
        calculateAll();
        opazujPovzetek();
    </script>
</body>
</html>

        // Isti prijem uporabi tudi naslednjič, ko zapis spremeni obliko.
        const OZNAKA_ZAPISA = 'pogled-2';

        function imaRazred(el, ime) {
            if (!el || !el.className) return false;
            return (' ' + el.className + ' ').indexOf(' ' + ime + ' ') !== -1;
        }

        function najdiStarsa(el, razred) {
            while (el && el.nodeType === 1) {
                if (imaRazred(el, razred)) return el;
                el = el.parentElement;
            }
            return null;
        }

        function kljucStolpca(col) {
            const el = col.querySelector('.mini-result');
            const id = el ? el.getAttribute('id') : null;
            return id || null;
        }

        // Doda ali odstrani razred 'zaprt'. Uporablja se za stolpce IN za sklope -
        // razred je isti, razlikujejo se le pravila v slogu.
        function nastaviStolpec(col, odprt) {
            if (odprt) col.classList.remove('zaprt');
            else col.classList.add('zaprt');
        }

        // ---------- Pripravljeno polje ----------
        // Prvi dotik polja ga obarva: prva tipka povozi vso vsebino, kot bi bila
        // oznacena. Pravega oznacevanja ne uporabljamo, ker iPhone ob njem prikaze
        // oblacek "Kopiraj / Prilepi". Drugi dotik pripravljenost umakne in polje
        // se ureja po starem. Nikjer ni ure - testno okolje je ne pozna.
        const RAZRED_PRIPRAVLJENO = 'pripravljeno';
        let vrednostObVstopu = '';   // vsebina polja v trenutku, ko je dobilo fokus
        let pravkarFokusirano = null; // polje, ki je fokus dobilo s tem istim dotikom

        function jeVnosnoPolje(el) {
            if (!el || !el.className) return false;
            const c = String(el.className);
            return c.indexOf('name-field') !== -1 || c.indexOf('num-field') !== -1;
        }

        function odpraviPripravljenost(el) {
            if (el && el.classList) el.classList.remove(RAZRED_PRIPRAVLJENO);
        }

        // Brskalnik je vtipkani znak ze vstavil v staro besedilo. Izluscimo ga iz
        // razlike med starim in novim zapisom in v polju pustimo samo njega.
        // Ce se je besedilo skrajsalo (vrac'alka), je izid prazno polje - enako,
        // kot bi vrac'alka pobrisala oznaceno vsebino.
        function povoziPripravljeno(t) {
            const staro = String(vrednostObVstopu);
            const novo = String(t.value);
            const dodano = novo.length - staro.length;
            if (dodano <= 0) { t.value = ''; return; }
            const konec = (typeof t.selectionStart === 'number') ? t.selectionStart : novo.length;
            t.value = novo.substring(konec - dodano, konec);
        }

        // ---------- Zadnje polje ----------
        // Polje, v katerem ste bili nazadnje, obdrzi obrobo tudi potem, ko ga
        // zapustite. Obrobljeno je vedno eno samo. Oznake nikamor ne shranimo,
        // zato je ob ponovnem odprtju strani ni.
        //
        // Ob dodajanju in brisanju oznaka ostane sama od sebe: addBaseRow doda eno
        // vrstico, odstraniVrstico odstrani eno, drugih se ne dotakneta. Ce izbrisete
        // prav vrstico z oznako, gre oznaka z njo - polja ni vec.
        const RAZRED_ZADNJE = 'zadnje';
        let poljeZadnje = null;

        function oznaciZadnje(el) {
            if (poljeZadnje && poljeZadnje !== el && poljeZadnje.classList) {
                poljeZadnje.classList.remove(RAZRED_ZADNJE);
            }
            poljeZadnje = (el && el.classList) ? el : null;
            if (poljeZadnje) poljeZadnje.classList.add(RAZRED_ZADNJE);
        }

        function pozabiZadnje(el) {
            if (!el || !el.classList) return;
            el.classList.remove(RAZRED_ZADNJE);
            if (poljeZadnje === el) poljeZadnje = null;
        }

        // ---------- Ponastavitev stolpca in razveljavitev ----------
        // Za vsak stolpec hranimo zadnje stanje pred ponastavitvijo. Zapis zivi le,
        // dokler je stran odprta; osvezitev strani ga izbrise.
        const POMNIK = {};
        const POMNIK_DELA = {};
        const VPRASANJE = 'Podatki v stolpcu bodo izbrisani.';
        const VPRASANJE_DEL = 'Podatki VSEH stolpcev bodo izbrisani.';
        // Peta postavka je pavza (1 ali 0). Stiri polja + pavza: tako jo zajameta
        // tudi kos in razveljavitev, brez posebnega pravila zanju.
        const PRIVZETA_POT = ['0', '0', '0', '0', 0];

        function vrstaStolpca(kljuc) {
            if (!kljuc) return null;
            if (kljuc.indexOf('sum-base-') === 0) return 'base';
            if (kljuc.indexOf('sum-tax-') === 0) return 'tax';
            if (kljuc.indexOf('sum-costs-') === 0) return 'costs';
            if (kljuc.indexOf('sum-travel-') === 0) return 'travel';
            return null;
        }

        function stevilkaStolpca(kljuc) {
            const m = String(kljuc).match(/(\d+)$/);
            return m ? m[1] : null;
        }

        function posnemiStolpec(vrsta, n) {
            if (vrsta === 'base') return collectRows('#base-container-' + n + ' .cost-row', 'base-val-' + n);
            if (vrsta === 'costs') return collectRows('#costs-container-' + n + ' .cost-row', 'cost-val-' + n);
            if (vrsta === 'tax') return collectRows('#taxes-container-' + n + ' .cost-row', 'tax-val-' + n);
            return TRAVEL_FIELDS.map(f => rawVal(f + n)).concat([jePavzaPoti(n)]);
        }

        // Postavi vsebino stolpca in poskrbi za vse, kar je od nje odvisno.
        function postaviStolpec(vrsta, n, vsebina) {
            if (vrsta === 'base') rebuildBases('base-container-' + n, n, vsebina);
            else if (vrsta === 'costs') rebuildCosts('costs-container-' + n, n, vsebina);
            else if (vrsta === 'tax') rebuildTaxes('taxes-container-' + n, n, vsebina);
            // Pri vrsticah polja izginejo z izrisom in oznaka gre z njimi. Polja
            // poti pa ostanejo ista, zato jim jo je treba odvzeti izrecno.
            else {
                TRAVEL_FIELDS.forEach((f, i) => {
                    setVal(f + n, vsebina[i]);
                    pozabiZadnje(document.getElementById(f + n));
                });
                nastaviPavzoPoti(n, !!vsebina[TRAVEL_FIELDS.length]);
            }
            oblikujVsaPolja();
            calculateAll();
            saveToStorage();
        }

        // Stolpca 3 in 4 sta obdavcena dela (glej CALCS). Stevilka stolpca prihaja
        // iz oznake polja in je zato niz - primerjamo prek Number.
        function jeObdavcen(n) {
            const c = CALCS.find(x => x.n === Number(n));
            return !!(c && c.taxed);
        }

        function privzetaVsebina(vrsta, n) {
            if (vrsta === 'base') return jeObdavcen(n) ? DEFAULT_BASES_TAXED : DEFAULT_BASES;
            if (vrsta === 'costs') return DEFAULT_COSTS;
            if (vrsta === 'tax') return DEFAULT_TAXES;
            return PRIVZETA_POT;
        }

        // Prazno polje in nicla sta ista stvar: v polju lahko pise 0 ali pa je
        // prazno, stolpec je v obeh primerih prazen.
        function steviloAli0(v) {
            const n = parseNum(v);
            return isFinite(n) ? n : 0;
        }

        function enakaVsebina(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                const x = a[i], y = b[i];
                if (x && typeof x === 'object') {
                    if (!y || typeof y !== 'object') return false;
                    if (String(x.name) !== String(y.name)) return false;
                    if (steviloAli0(x.val) !== steviloAli0(y.val)) return false;
                    // Stolpec, v katerem je spremenjena SAMO pavza, ni zacetno
                    // stanje - kos mora biti buden (Borut, 10. 8. 2026).
                    if (!!x.pav !== !!y.pav) return false;
                } else if (steviloAli0(x) !== steviloAli0(y)) return false;
            }
            return true;
        }

        // Stolpec je v zacetnem stanju, kadar izgleda natanko tako, kot bi po
        // ponastavitvi. Vprasanje ni "so zneski nic", ampak "bi ponastavitev sploh
        // kaj spremenila" - zato bo pravilo veljalo tudi takrat, ko bo stolpec 4
        // svoje zacetne zneske dobival iz Nastavitev (koraka 7 in 8).
        function jeZacetno(col) {
            if (!col) return true;
            const kljuc = kljucStolpca(col);
            const vrsta = vrstaStolpca(kljuc);
            const n = stevilkaStolpca(kljuc);
            if (!vrsta || !n) return true;
            return enakaVsebina(posnemiStolpec(vrsta, n), privzetaVsebina(vrsta, n));
        }

        function jeDelZacetni(mreza) {
            let vse = true;
            if (mreza) zaVsakStolpec(mreza, col => { if (!jeZacetno(col)) vse = false; });
            return vse;
        }

        // Vidnost razveljavitve je svoje stanje: ugasne ze ob prvi tipki, sicer bi
        // cez svez vpis vrnila stare podatke.
        function osveziGumbRazveljavi(col) {
            const gumb = col ? col.querySelector('.btn-razveljavi') : null;
            if (gumb && gumb.style) {
                gumb.style.setProperty('display', POMNIK[kljucStolpca(col)] ? 'flex' : 'none');
            }
        }

        // Kos je siv natanko takrat, kadar v stolpcu ni kaj brisati. Sivina po
        // ponastavitvi in sivina, dokler gori velika razveljavitev, sta s tem
        // POSLEDICI istega pravila in ne vec izjemi v kodi.
        function osveziRazveljavitev(col) {
            if (!col) return;
            osveziGumbRazveljavi(col);
            const kos = col.querySelector('.btn-ponastavi');
            if (kos && kos.classList) {
                if (jeZacetno(col)) kos.classList.add('pasiven');
                else kos.classList.remove('pasiven');
            }
        }

        // Trenutek presoje: ko polje zapustite in ko dodate ali odstranite vrstico.
        // Med tipkanjem se namenoma ne zgodi nic - kos med popravljanjem zneska ne
        // sme utripati. Osvezimo cel del, ker se z enim stolpcem lahko spremeni
        // tudi veliki kos.
        function osveziKose(el) {
            const col = najdiStarsa(el, 'col');
            if (!col) return;
            osveziDel(najdiStarsa(col, 'calc-grid'));
        }

        // ----- cel del (neobdavcen ali obdavcen) -----
        function kljucDela(mreza) {
            const el = mreza ? mreza.querySelector('.mini-result') : null;
            const id = el ? el.getAttribute('id') : null;
            const m = id ? String(id).match(/(\d+)$/) : null;
            return m ? 'del-' + m[1] : null;
        }

        function zaVsakStolpec(mreza, fn) {
            mreza.querySelectorAll('.col').forEach(col => {
                const k = kljucStolpca(col);
                const vrsta = vrstaStolpca(k);
                if (vrsta) fn(col, k, vrsta, stevilkaStolpca(k));
            });
        }

        function osveziGumbRazveljaviDel(mreza) {
            const gumb = mreza ? mreza.querySelector('.btn-del-razveljavi') : null;
            if (gumb && gumb.style) {
                gumb.style.setProperty('display', POMNIK_DELA[kljucDela(mreza)] ? 'flex' : 'none');
            }
        }

        // Veliki kos ima isto pravilo kot mali: siv je, dokler so vsi stolpci
        // njegovega dela v zacetnem stanju.
        function osveziDel(mreza) {
            if (!mreza) return;
            osveziGumbRazveljaviDel(mreza);
            const kos = mreza.querySelector('.btn-del-ponastavi');
            if (kos && kos.classList) {
                if (jeDelZacetni(mreza)) kos.classList.add('pasiven');
                else kos.classList.remove('pasiven');
            }
            zaVsakStolpec(mreza, col => osveziRazveljavitev(col));
        }

        function ponastaviDel(mreza) {
            const kljuc = kljucDela(mreza);
            if (!kljuc || POMNIK_DELA[kljuc]) return;
            // Pasiven kos ne vprasa in ne shrani praznega stanja v pomnik.
            if (jeDelZacetni(mreza)) return;
            if (typeof confirm === 'function' && confirm(VPRASANJE_DEL) !== true) return;
            const posnetek = {};
            zaVsakStolpec(mreza, (col, k, vrsta, n) => {
                // Ce je bil stolpec ze ponastavljen, si zapomnimo stanje PRED tisto
                // ponastavitvijo - sicer bi velika razveljavitev vrnila prazno.
                posnetek[k] = POMNIK[k] || posnemiStolpec(vrsta, n);
                delete POMNIK[k];
                postaviStolpec(vrsta, n, privzetaVsebina(vrsta, n));
            });
            POMNIK_DELA[kljuc] = posnetek;
            osveziDel(mreza);
        }

        function razveljaviDel(mreza) {
            const kljuc = kljucDela(mreza);
            const posnetek = POMNIK_DELA[kljuc];
            if (!posnetek) return;
            delete POMNIK_DELA[kljuc];
            zaVsakStolpec(mreza, (col, k, vrsta, n) => {
                if (posnetek[k]) postaviStolpec(vrsta, n, posnetek[k]);
            });
            osveziDel(mreza);
        }

        function ponastaviStolpec(col) {
            const kljuc = kljucStolpca(col);
            const vrsta = vrstaStolpca(kljuc);
            const n = stevilkaStolpca(kljuc);
            if (!vrsta || !n) return;
            // Pasiven kos ne stori nicesar in ne vprasa: v stolpcu ni kaj brisati.
            // Stanje po ponastavitvi in stanje pod prizgano veliko razveljavitvijo
            // sta zajeta s tem istim pravilom - stolpec je takrat prazen.
            if (jeZacetno(col)) return;
            // Ce okna z vprasanjem ni (testno okolje), se ponastavitev izvede.
            if (typeof confirm === 'function' && confirm(VPRASANJE) !== true) return;
            // Pomnik hrani stanje pred PRVO spremembo in ga druga ne sme povoziti.
            // Od koraka 1j pomnik napolni tudi izbris vrstice, zato tu ne smemo
            // vec odnehati - kos mora ponastaviti tudi takrat, kadar posnetek ze
            // stoji. Odnehati bi pomenilo, da po izbrisu vrstice kos ne dela.
            if (!POMNIK[kljuc]) POMNIK[kljuc] = posnemiStolpec(vrsta, n);
            postaviStolpec(vrsta, n, privzetaVsebina(vrsta, n));
            osveziRazveljavitev(col);
        }

        function razveljaviStolpec(col) {
            const kljuc = kljucStolpca(col);
            const vsebina = POMNIK[kljuc];
            if (!vsebina) return;
            delete POMNIK[kljuc];
            postaviStolpec(vrstaStolpca(kljuc), stevilkaStolpca(kljuc), vsebina);
            osveziRazveljavitev(col);
        }

        // Vsaka razveljavitev pripada svojemu stolpcu: sprememba v Stroskih
        // pobrise razveljavitev pri Stroskih, tista pri Davkih ostane.
        function pozabiRazveljavitev(el) {
            const col = najdiStarsa(el, 'col');
            if (!col) return;
            const kljuc = kljucStolpca(col);
            if (kljuc && POMNIK[kljuc]) {
                delete POMNIK[kljuc];
                osveziGumbRazveljavi(col);
            }
            // Prvi vpis kamorkoli v del ugasne tudi veliko razveljavitev.
            const mreza = najdiStarsa(col, 'calc-grid');
            const kd = kljucDela(mreza);
            if (kd && POMNIK_DELA[kd]) {
                delete POMNIK_DELA[kd];
                osveziGumbRazveljaviDel(mreza);
            }
        }

        // Gumba nista v HTML: postavi ju skript v vsak stolpec, ki ima seštevek.
        // Tako jih ni treba prepisovati stirinajstkrat in korak 2 jih dobi zastonj.
        const GUMBA_HTML =
            '<button type="button" class="btn-stolpec btn-ponastavi" title="Ponastavi stolpec" aria-label="Ponastavi stolpec">' +
            '<span class="kos" aria-hidden="true"><span class="kos-pokrov"></span><span class="kos-telo"></span></span></button>' +
            '<button type="button" class="btn-stolpec btn-razveljavi" title="Razveljavi ponastavitev" aria-label="Razveljavi ponastavitev">&#8634;</button>';

        const GUMBA_DELA_HTML =
            '<button type="button" class="btn-stolpec btn-ponastavi btn-del-ponastavi" title="Ponastavi vse stolpce" aria-label="Ponastavi vse stolpce">' +
            '<span class="kos" aria-hidden="true"><span class="kos-pokrov"></span><span class="kos-telo"></span></span></button>' +
            '<button type="button" class="btn-stolpec btn-razveljavi btn-del-razveljavi" title="Razveljavi ponastavitev vseh stolpcev" aria-label="Razveljavi ponastavitev vseh stolpcev">&#8634;</button>';

        function postaviGumbeStolpcev() {
            document.querySelectorAll('.col').forEach(col => {
                const kljuc = kljucStolpca(col);
                if (!vrstaStolpca(kljuc)) return;
                const blok = col.querySelector('.summary-block');
                if (!blok || blok.querySelector('.sb-gumbi')) return;

                const zneski = document.createElement('div');
                zneski.className = 'sb-zneski';
                // slice: v brskalniku je children ziva zbirka brez forEach,
                // poleg tega se med prelaganjem krajsa.
                Array.prototype.slice.call(blok.children).forEach(o => zneski.appendChild(o));

                const gumbi = document.createElement('div');
                gumbi.className = 'sb-gumbi';
                gumbi.innerHTML = GUMBA_HTML;

                blok.appendChild(gumbi);
                blok.appendChild(zneski);
                osveziRazveljavitev(col);
            });

            // Gumba za cel del. Vstavljena sta V mrezo kot zadnje polje cez vso
            // sirino - tako sta na Macu pod stolpci, na telefonu pa na dnu sklada.
            document.querySelectorAll('.calc-grid').forEach(mreza => {
                if (!kljucDela(mreza) || mreza.querySelector('.del-gumbi')) return;
                const blok = document.createElement('div');
                blok.className = 'del-gumbi';
                blok.innerHTML = GUMBA_DELA_HTML;
                mreza.appendChild(blok);
                osveziDel(mreza);
            });
        }

        // ---------- Harmonika sklopa (cele tabele) ----------
        // Kljuc sklopa je oznaka njegovega skupnega zneska ("tot-total-1"), zato
        // tudi tu v HTML ni novih oznak.
        //
        // POZOR - zapisujemo ZAPRTE sklope, ne odprtih. Razlog: shranjeno stanje
        // iz starejse razlicice o sklopih ne ve nicesar. Ce bi zapisovali odprte,
        // bi molk starega zapisa pomenil "oba zaprta" in uporabnik bi ob prvem
        // odprtju videl dva prazna naslova. Tako molk pomeni "oba odprta".
        const ZAPRT_PREDPONA = 'zaprt:';

        function kljucSklopa(container) {
            const el = container.querySelector('.sklop-znesek');
            if (!el || !el.className) return null;
            const m = String(el.className).match(/tot-total-(\d+)/);
            return m ? 'sklop-' + m[1] : null;
        }

        // forEach (ne filter): v brskalniku querySelectorAll vrne NodeList,
        // ki filtra nima.
        function zaVsakSklop(fn) {
            document.querySelectorAll('.container').forEach(c => {
                const k = kljucSklopa(c);
                if (k) fn(c, k);
            });
        }

        // Zapis vsebuje dvoje: kljuce ODPRTIH stolpcev in kljuce ZAPRTIH sklopov
        // (ti s predpono). Razlog za razliko je opisan pri ZAPRT_PREDPONA.
        function shraniPogled() {
            const zapis = [OZNAKA_ZAPISA];
            document.querySelectorAll('.col').forEach(col => {
                const k = kljucStolpca(col);
                if (k && !imaRazred(col, 'zaprt')) zapis.push(k);
            });
            zaVsakSklop((c, k) => {
                if (imaRazred(c, 'zaprt')) zapis.push(ZAPRT_PREDPONA + k);
            });
            try {
                localStorage.setItem(POGLED_KLJUC, JSON.stringify(zapis));
            } catch (e) {
                console.error('Stanja stolpcev ni bilo mogoče shraniti', e);
            }
        }

        // PRIVZETO JE VSE ZAPRTO (31. 7. 2026), na vsaki širini zaslona enako.
        // Uporabnik odpre, kar potrebuje, in aplikacija si to zapomni.
        //
        // Zapis je uporaben le, če je seznam IN ima oznako različice. Trije primeri,
        // ko uporaben ni - zapisa ni, prazen je, pokvarjen je - dajo isti izid:
        // aplikacija ne ugiba, ampak vse zapre.
        function naloziPogled() {
            let seznam = null;
            try {
                const raw = localStorage.getItem(POGLED_KLJUC);
                if (raw) {
                    const p = JSON.parse(raw);
                    if (Array.isArray(p) && p.indexOf(OZNAKA_ZAPISA) !== -1) seznam = p;
                }
            } catch (e) {
                seznam = null;
            }

            document.querySelectorAll('.col').forEach(col => {
                const k = kljucStolpca(col);
                if (!k) return;
                nastaviStolpec(col, !!seznam && seznam.indexOf(k) !== -1);
            });

            // Sklopi se zapisujejo obrnjeno (zabeleži se ZAPRTE), zato brez
            // uporabnega zapisa ni podatka o njih - in takrat velja privzeto: zaprto.
            zaVsakSklop((c, k) => {
                const zaprt = seznam ? seznam.indexOf(ZAPRT_PREDPONA + k) !== -1 : true;
                nastaviStolpec(c, !zaprt);
            });
        }

        // ---------- Dogodki ----------
        document.addEventListener('input', function (e) {
            const t = e.target;

            // Prva tipka v pripravljenem polju povozi vso vsebino.
            if (imaRazred(t, RAZRED_PRIPRAVLJENO)) {
                odpraviPripravljenost(t);
                povoziPripravljeno(t);
            }
            // Vsak vpis je sprememba: razveljavitev v tem stolpcu ugasne.
            pozabiRazveljavitev(t);

            // Med tipkanjem je besedilo surovo, zato je zdaj pravi trenutek,
            // da si zapomnimo strojno vrednost polja.
            if (jeStevilskoPolje(t)) {
                // V polju vejice ni: takoj postane pika. Tipke ne zavračamo, ker
                // iPhone pri številski tipkovnici ponuja SAMO vejico - z zavrnitvijo
                // decimalk na telefonu sploh ne bi bilo mogoče vpisati.
                // Pretvorimo, ne izbrišemo: "1,5" mora ostati 1,5 in ne postati 15.
                const besedilo = String(t.value);
                if (besedilo.indexOf(',') !== -1) {
                    if (besedilo.indexOf('.') === -1) {
                        // Običajno tipkanje: "1," -> "1."  in  "1,5" -> "1.5".
                        // Zamenjava je znak za znak, zato kazalec ostane, kjer je bil.
                        const zac = t.selectionStart, kon = t.selectionEnd;
                        t.value = besedilo.replace(/,/g, '.');
                        if (typeof zac === 'number' && typeof t.setSelectionRange === 'function') {
                            try { t.setSelectionRange(zac, kon); } catch (err) { /* ni bistveno */ }
                        }
                    } else {
                        // Pika IN vejica hkrati: prilepljen tuj ali oblikovan zapis
                        // ("1.234,56"). Vrednost prepustimo parseNum, ki tak zapis
                        // razume, polje pa prepišemo v strojno obliko. Brez tega bi
                        // "1.234,56" po zamenjavi vejice postal "1.234.56" = 123456.
                        // Odvečno ločilo na koncu ("1.5,") najprej odstranimo.
                        t.value = String(parseNum(besedilo.replace(/[.,]+$/, '')));
                    }
                }
                if (t.setAttribute) {
                    t.setAttribute(ATRIBUT_VREDNOST, String(parseNum(t.value)));
                }
            }
            calculateAll();
        });

        // Ob zapustitvi polja vrednosti normaliziramo (davek 0-100 %, ostala števila >= 0),
        // da uporabnik vidi točno tisto, s čimer kalkulator računa.
        document.addEventListener('change', function (e) {
            const t = e.target;
            if (!t || !t.className) return;
            const cls = String(t.className);
            let changed = false;

            if (cls.indexOf('tax-val-') !== -1) {
                // Zapis pustimo pri miru (npr. "7,5" ali "4.00"); popravimo samo, če je izven 0-100 %
                const raw = vrednostPolja(t);
                const p = clamp(raw, 0, MAX_TAX);
                if (p !== raw) { vpisiSurovo(t, String(p)); changed = true; }
            } else if (cls.indexOf('nonneg') !== -1) {
                if (vrednostPolja(t) < 0) { vpisiSurovo(t, '0'); changed = true; }
            }

            if (changed) calculateAll();
        });

        // Ob vstopu v polje pokažemo surovo številko (brez pik za tisočice),
        // ob izhodu jo oblikujemo nazaj. Uporabljamo focusin/focusout, ker se
        // focus/blur ne dvigata do dokumenta.
        document.addEventListener('focusin', function (e) {
            const t = e.target;
            if (jeStevilskoPolje(t)) {
                t.value = (String(t.value).trim() === '') ? '' : String(vrednostPolja(t));
            }
            // Pripravljenost postavimo SELE za prepisom: sicer bi si zapomnili
            // oblikovan zapis ("1.250,00") namesto tistega, ki je zdaj v polju.
            if (jeVnosnoPolje(t)) {
                vrednostObVstopu = String(t.value);
                t.classList.add(RAZRED_PRIPRAVLJENO);
                pravkarFokusirano = t;
                oznaciZadnje(t);
                zapomniLego();
            }
        });

        document.addEventListener('focusout', function (e) {
            const t = e.target;
            odpraviPripravljenost(t);
            if (pravkarFokusirano === t) pravkarFokusirano = null;
            if (jeStevilskoPolje(t)) t.value = oblikovanoPolje(t.value);
            // Zapustitev polja je trenutek, ko se kos odloci, ali je se kaj brisati.
            osveziKose(t);
        });

        // Klik na naslov odpre ali zapre stolpec.
        // Zaprt trak se odzove na klik po vsej širini, odprt samo na naslovu -
        // tako klik v vnosno polje stolpca ne zapre.
        // ---------- Drsenje vrstice in meni desnega klika (korak 1j) ----------
        // Odprta je vedno SAMO ENA vrstica. Tako delata Ionic in Framework7: ob
        // novem potegu se prejsnja zapre sama.
        let odprtiTir = null;

        function zapriTir(tir) {
            if (!tir) return;
            if (typeof tir.scrollTo === 'function') tir.scrollTo({ left: 0, behavior: 'smooth' });
            else if (typeof tir.scrollLeft === 'number') tir.scrollLeft = 0;
        }

        function zapriOdprtiTir() {
            if (!odprtiTir) return;
            zapriTir(odprtiTir);
            odprtiTir = null;
        }

        // Dogodek drsenja NE potuje navzgor, zato ga lovimo v lovilni fazi na
        // dokumentu. Tako je poslusalec en sam in novih vrstic ni treba prijavljati.
        document.addEventListener('scroll', function (e) {
            const t = e.target;
            if (!imaRazred(t, 'tir')) return;
            zapriMeni();
            if (t.scrollLeft > 1) {
                if (odprtiTir && odprtiTir !== t) zapriTir(odprtiTir);
                odprtiTir = t;
            } else if (odprtiTir === t) {
                odprtiTir = null;
            }
        }, true);

        // ---------- Scipanje z dvema prstoma (11. 8. 2026) ----------
        // Prsta dva, tira dva: vsak prst potegne vrstico pod sabo. Uhojena pot, ki
        // jo uporabljajo tudi ogrodja: dokler je na steklu vec kot en prst, drsniki
        // ne drsijo, in prepoved velja do dviga ZADNJEGA prsta. Nic ne prekliksemo,
        // zato povecava ostane nedotaknjena. Delo z dotiki je na iOS in Androidu
        // enako - to je bila Borutova zahteva.
        const RAZRED_SCIPANJE = 'scipanje';
        let legaTiraPredScipanjem = null;

        function zacniScipanje() {
            if (!document.body || !document.body.classList) return;
            if (document.body.classList.contains(RAZRED_SCIPANJE)) return;
            // Odprta vrstica mora ostati odprta in polje aktivno (Borut, 11. 8.
            // 2026). Prepoved drsenja bi vrstico sama vrnila na zacetek, zato si
            // njeno lego zapomnimo in jo po scipanju postavimo nazaj. Fokusa se
            // ne dotaknemo z nicimer.
            legaTiraPredScipanjem = (odprtiTir && typeof odprtiTir.scrollLeft === 'number')
                ? odprtiTir.scrollLeft : null;
            document.body.classList.add(RAZRED_SCIPANJE);
        }

        function koncajScipanje() {
            if (!document.body || !document.body.classList) return;
            if (!document.body.classList.contains(RAZRED_SCIPANJE)) return;
            document.body.classList.remove(RAZRED_SCIPANJE);
            const lega = legaTiraPredScipanjem;
            legaTiraPredScipanjem = null;
            if (lega === null || !odprtiTir) return;
            odprtiTir.scrollLeft = lega;
        }

        function steviloPrstov(e) {
            return (e && e.touches && typeof e.touches.length === 'number') ? e.touches.length : 0;
        }

        document.addEventListener('touchstart', function (e) {
            if (steviloPrstov(e) > 1) zacniScipanje();
        }, { passive: true });

        // Sele ko je dvignjen ZADNJI prst. Dokler je na steklu se en, gib ni koncan
        // in bi tir spet zacel drseti sredi povecave.
        document.addEventListener('touchend', function (e) {
            if (steviloPrstov(e) === 0) koncajScipanje();
        }, { passive: true });

        // Prekinjen dotik (klic, obvestilo, dlan cez zaslon) mora prepoved sprostiti
        // enako kot navaden dvig - sicer bi tiri ostali zakleneni.
        document.addEventListener('touchcancel', function (e) {
            if (steviloPrstov(e) === 0) koncajScipanje();
        }, { passive: true });

        // Meni nastane sele ob prvi uporabi. Ob odprtju strani v telesu s tem ni
        // nicesar, cesar prej ni bilo.
        let meniEl = null;
        let meniGumb = null;

        function zagotoviMeni() {
            if (meniEl) return meniEl;
            meniEl = document.createElement('div');
            meniEl.className = 'meni-desni';
            meniEl.innerHTML = '<button type="button" class="meni-izbrisi">Izbriši</button>';
            document.body.appendChild(meniEl);
            return meniEl;
        }

        function zapriMeni() {
            if (meniEl && meniEl.style) meniEl.style.setProperty('display', 'none');
            meniGumb = null;
        }

        function odpriMeni(gumb, x, y) {
            const el = zagotoviMeni();
            if (!el.style) return;
            el.style.setProperty('left', (typeof x === 'number' ? Math.round(x) : 0) + 'px');
            el.style.setProperty('top', (typeof y === 'number' ? Math.round(y) : 0) + 'px');
            el.style.setProperty('display', 'block');
            meniGumb = gumb;
        }

        // Desni klik in Control + klik sprozita isti dogodek - izmerjeno na Macu
        // 11. 8. 2026. Brskalnikov lastni meni utisamo SAMO na gumbu vrstice;
        // drugod po strani ostane nedotaknjen.
        document.addEventListener('contextmenu', function (e) {
            const gumb = najdiStarsa(e.target, 'btn-action');
            // Gumb "+" ni vrstica. Oznaka 'brez-izbrisa' pomeni vrstico, ki se ne
            // da izbrisati - tam se meni ne odpre in desni klik ne stori nicesar.
            if (!gumb || imaRazred(gumb, 'btn-add') || imaRazred(gumb, 'brez-izbrisa')) return;
            if (typeof e.preventDefault === 'function') e.preventDefault();
            zapriOdprtiTir();
            odpriMeni(gumb, e.clientX, e.clientY);
        });

        // Esc zapre meni: tretja pot poleg klika drugam in drsenja.
        document.addEventListener('keydown', function (e) {
            if (e && (e.key === 'Escape' || e.key === 'Esc')) zapriMeni();
        });

        document.addEventListener('click', function (e) {
            // Meni desnega klika ima prednost: dokler je odprt, je edino novo na
            // zaslonu.
            if (imaRazred(e.target, 'meni-izbrisi')) {
                const g = meniGumb;
                zapriMeni();
                if (g) odstraniVrstico(g, g.getAttribute('data-vrsta'));
                return;
            }
            zapriMeni();

            // Klik drugam zapre odprto vrstico. Klik V odprto vrstico je ne zapre -
            // tam stoji gumb Izbrisi, ki ga je uporabnik pravkar razkril.
            if (odprtiTir && !najdiStarsa(e.target, 'tir')) zapriOdprtiTir();

            // Dotik v vnosno polje: prvi ga je pravkar pripravil, drugi
            // pripravljenost umakne. Klik v polje stolpca nikoli ne odpira.
            if (jeVnosnoPolje(e.target)) {
                if (pravkarFokusirano === e.target) pravkarFokusirano = null;
                else odpraviPripravljenost(e.target);
                return;
            }

            // Dodajanje vrstice je sprememba: razveljavitev ugasne.
            if (imaRazred(e.target, 'btn-add')) { pozabiRazveljavitev(e.target); return; }

            // Gumb za pavziranje v stolpcu Pot ne nastane s kodo za vrstice, zato
            // svojega dejanja ob nastanku nima - obravnavamo ga tu.
            const pavzaPoti = najdiStarsa(e.target, 'brez-izbrisa');
            if (pavzaPoti) { preklopiPavzoPoti(pavzaPoti); return; }

            // Brisanje vrstice si razveljavitev USTVARI (korak 1j, poseg 2), zato
            // je tu ne ugasnemo. Gumb vrstice vseeno prestrezemo, da ne pade v
            // pravila pod tem.
            if (imaRazred(e.target, 'btn-action') || imaRazred(e.target, 'izbrisi')) return;

            // Gumba celega dela morata biti pred stolpcnima: nosita oba razreda.
            const kosDela = najdiStarsa(e.target, 'btn-del-ponastavi');
            if (kosDela) { ponastaviDel(najdiStarsa(kosDela, 'calc-grid')); return; }

            const razvDela = najdiStarsa(e.target, 'btn-del-razveljavi');
            if (razvDela) { razveljaviDel(najdiStarsa(razvDela, 'calc-grid')); return; }

            // Gumba stolpca. najdiStarsa zajame tudi dotik narisanega kosa.
            const ponastavi = najdiStarsa(e.target, 'btn-ponastavi');
            if (ponastavi) { ponastaviStolpec(najdiStarsa(ponastavi, 'col')); return; }

            const razveljavi = najdiStarsa(e.target, 'btn-razveljavi');
            if (razveljavi) { razveljaviStolpec(najdiStarsa(razveljavi, 'col')); return; }

            // Najprej sklop: klik na naslov tabele zlozi ali razgrne celo tabelo.
            // Naslov stoji ZUNAJ stolpcev, zato se klika ne moreta prekrivati.
            const naslov = najdiStarsa(e.target, 'sklop-naslov');
            if (naslov) {
                const sklop = najdiStarsa(naslov, 'container');
                if (sklop && kljucSklopa(sklop)) {
                    nastaviStolpec(sklop, imaRazred(sklop, 'zaprt'));
                    shraniPogled();
                }
                return;
            }

            const col = najdiStarsa(e.target, 'col');
            if (!col || !kljucStolpca(col)) return;
            const jeZaprt = imaRazred(col, 'zaprt');
            if (!jeZaprt && !najdiStarsa(e.target, 'col-header')) return;
            nastaviStolpec(col, jeZaprt);
            shraniPogled();
        });

        // Ob odprtju strani: najprej nariši sklope, nato zgradi vrstice
        // (shranjene ali privzete) in izračunaj. Vrstni red je pomemben -
        // vse spodnje dela nad stolpci, ki jih postavi sestaviSklope.
        sestaviSklope();
        loadFromStorage();
        postaviGumbeStolpcev();
        oblikujVsaPolja();
        naloziPogled();
        calculateAll();
        // ---------- Vrnitev strani po zaprtju tipkovnice ----------
        // Po zaprtju tipkovnice Safari strani ne vrne tja, kjer je bila - ostane
        // blizu polja, v katero se je tipkalo (izmerjeno 9. 8. 2026: 1248 -> 1435).
        // Zato si lego zapomnimo sami in jo vrnemo.
        //
        // Uhojena pot, ki jo za iPhone uporablja vecina: kdaj se oglasiti pove
        // visualViewport (koliko prostora ostane na zaslonu), kaj narediti pa je
        // znana praksa "scroll restoration" - zapomni stevilko, vrni stevilko.
        // Neposredne naprave za tipkovnico (VirtualKeyboard API) Safari nima.
        //
        // V kodi ni nobene vpisane stevilke: polno visino zaslona in lego strani
        // si naprava izmeri sama. Ure ni nikjer - testno okolje je ne pozna.
        //
        // Borutove odlocitve 9. in 10. 8. 2026:
        //  - vrnemo se na lego izpred dotika ZADNJEGA polja;
        //  - ce med odprto tipkovnico s prstom odpeljete drugam, vrnitve ni;
        //  - ce podrsate SELE po kljukici, obvelja kljukica in vrnitev stece;
        //  - vrnitev je animirana, z brskalnikovim lastnim gladkim drsenjem.
        const OKNO = (typeof window !== 'undefined' && window.visualViewport)
            ? window.visualViewport : null;

        let legaPredVstopom = null;    // kako dalec je bila stran zdrsnjena pred vstopom
        let visinaBrezTipkovnice = null; // koliko prostora je, ko tipkovnice ni (izmerjeno)
        let prostorSeJeSkrcil = false; // smo tipkovnico sploh videli?

        function zapomniLego() {
            if (!OKNO) return;
            // Ob vsakem vstopu v polje: vrnemo se na lego izpred ZADNJEGA polja.
            legaPredVstopom = window.pageYOffset;
            // Polno visino izmerimo le, kadar tipkovnice se ni bilo - sicer bi si
            // ob prehodu na naslednje polje zapomnili visino s tipkovnico vred.
            if (!prostorSeJeSkrcil) visinaBrezTipkovnice = OKNO.height;
        }

        function pozabiLego() {
            legaPredVstopom = null;
            prostorSeJeSkrcil = false;
        }

        function vrniLego() {
            const cilj = legaPredVstopom;
            pozabiLego();
            if (cilj === null) return;
            // Gladko drsenje je brskalnikovo; kjer ga ni, skocimo naenkrat.
            if ('scrollBehavior' in document.documentElement.style) {
                window.scrollTo({ top: cilj, behavior: 'smooth' });
            } else {
                window.scrollTo(cilj, cilj);
            }
        }

        if (OKNO) {
            // Prostor na zaslonu je posreden znak: tipkovnica ga vzame, vrstica z
            // naslovom strani pa tudi. Zato se odzovemo samo, ce smo krcenje res
            // videli, in sele ko je prostora spet toliko kot pred vstopom v polje.
            OKNO.addEventListener('resize', function () {
                if (legaPredVstopom === null) return;
                if (OKNO.height < visinaBrezTipkovnice) { prostorSeJeSkrcil = true; return; }
                if (prostorSeJeSkrcil) vrniLego();
            });

            // Prst po strani med ODPRTO tipkovnico = vas namerni premik in ta
            // obvelja. Po kljukici tega ne velja vec - takrat je krcenje ze mimo.
            document.addEventListener('touchmove', function () {
                if (prostorSeJeSkrcil) pozabiLego();
            }, { passive: true });
        }

    </script>
</body>
</html>
